<script>
(function(){
const D=window.HLTV_DATA;
const app=document.getElementById('app');
if(!D){app.innerHTML='<div class="empty">Өгөгдлийн файл (hltv-data.js) олдсонгүй.</div>';return}
const H='https://www.hltv.org';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const img=i=>{if(i==null||i<0)return '';if(D.imgData)return D.imgData[i]||'';const p=D.imgs[i];return /^https?:/.test(p)?p:'https://img-cdn.hltv.org/'+p};
const pimg=i=>img(i)||BLANK;
// Mongolian teams: known list, BC.Game, and any ranked team with 2+ Mongolian players
const MN_TEAMS=new Set((D.mnTeams||[]).concat([6248,12878]));
(D.ranking||[]).forEach(r=>{if((r[7]||[]).filter(p=>p[3]==='Mongolia').length>=2)MN_TEAMS.add(D.tms[r[1]][0])});
const isMnTeam=id=>MN_TEAMS.has(+id)||(D.teamFlag&&D.teamFlag[id]==='MN');
const isMnMatch=m=>isMnTeam(m.t1[0]||(LT(m.t1).id))||isMnTeam(m.t2[0]||(LT(m.t2).id))||m.f1==='MN'||m.f2==='MN';
const CMN={"Mongolia": "Монгол", "Russia": "Орос", "Ukraine": "Украин", "Belarus": "Беларусь", "Kazakhstan": "Казахстан", "Brazil": "Бразил", "Argentina": "Аргентин", "Chile": "Чили", "Uruguay": "Уругвай", "Peru": "Перу", "Colombia": "Колумб", "Mexico": "Мексик", "United States": "АНУ", "Canada": "Канад", "France": "Франц", "Germany": "Герман", "Denmark": "Дани", "Sweden": "Швед", "Norway": "Норвеги", "Finland": "Финланд", "Estonia": "Эстони", "Latvia": "Латви", "Lithuania": "Литва", "Poland": "Польш", "Czech Republic": "Чех", "Czechia": "Чех", "Slovakia": "Словак", "Hungary": "Унгар", "Romania": "Румын", "Bulgaria": "Болгар", "Serbia": "Серби", "Bosnia and Herzegovina": "Босни", "Croatia": "Хорват", "Slovenia": "Словени", "Montenegro": "Монтенегро", "North Macedonia": "Хойд Македон", "Albania": "Албани", "Kosovo": "Косово", "Greece": "Грек", "Turkey": "Турк", "Israel": "Израиль", "Portugal": "Португал", "Spain": "Испани", "Italy": "Итали", "Switzerland": "Швейцари", "Austria": "Австри", "Belgium": "Бельги", "Netherlands": "Нидерланд", "United Kingdom": "Их Британи", "Ireland": "Ирланд", "China": "Хятад", "Japan": "Япон", "South Korea": "Өмнөд Солонгос", "Korea": "Солонгос", "Taiwan": "Тайвань", "Hong Kong": "Хонконг", "Singapore": "Сингапур", "Malaysia": "Малайз", "Indonesia": "Индонез", "Thailand": "Тайланд", "Vietnam": "Вьетнам", "Philippines": "Филиппин", "India": "Энэтхэг", "Pakistan": "Пакистан", "Bangladesh": "Бангладеш", "Australia": "Австрали", "New Zealand": "Шинэ Зеланд", "Saudi Arabia": "Саудын Араб", "United Arab Emirates": "АНЭУ", "Jordan": "Иордан", "Lebanon": "Ливан", "Egypt": "Египет", "South Africa": "Өмнөд Африк", "Morocco": "Марокко", "Tunisia": "Тунис", "Uzbekistan": "Узбекистан", "Kyrgyzstan": "Киргиз", "Georgia": "Гүрж", "Armenia": "Армен", "Azerbaijan": "Азербайжан", "Moldova": "Молдав", "Iceland": "Исланд", "Malta": "Мальта", "Cyprus": "Кипр", "Luxembourg": "Люксембург", "Europe": "Европ", "Asia": "Ази", "Other": "Дэлхий", "World": "Дэлхий", "North America": "Хойд Америк", "South America": "Өмнөд Америк", "Oceania": "Далайн орнууд", "CIS": "ТУХН", "Venezuela": "Венесуэл", "Paraguay": "Парагвай", "Bolivia": "Боливи", "Ecuador": "Эквадор", "Guatemala": "Гватемал", "Costa Rica": "Коста Рика", "Dominican Republic": "Доминикан", "Puerto Rico": "Пуэрто Рико", "Iran": "Иран", "Iraq": "Ирак", "Syria": "Сири", "Kuwait": "Кувейт", "Qatar": "Катар", "Tajikistan": "Тажикистан", "Turkmenistan": "Туркменистан", "Afghanistan": "Афганистан", "Nepal": "Балба", "Sri Lanka": "Шри Ланка", "Myanmar": "Мьянмар", "Cambodia": "Камбож", "Laos": "Лаос", "Macau": "Макао"};
const cMn=n=>CMN[n]||n||'';
const FL=D.flags||{},TF=D.teamFlag||{},CC=D.countryCode||{};
const flagOfTeam=(id,code)=>FL[code]||FL[TF[id]]||'';
const flagOfCountry=n=>FL[CC[n]]||'';
const fbg=(url,cls)=>url?`<span class="flagbg ${cls||''}" style="background-image:url('${url}')"></span>`:'';
const TM=i=>{const t=D.tms[i];return t?{id:t[0],slug:t[1],name:t[2],logo:img(t[3])}:{id:0,name:'TBD',logo:''}};
/* events without their own logo borrow the organiser's latest one (BLAST, ESL, PGL, IEM, ...) */
const ORGS=['esports world cup','perfect world','thunderpick','dreamhack','starladder','starseries','blast','iem','esl','pgl','cct','major','ecs','frag','esea','mlg','fissure','betboom','skyesports','nodwin','elisa','dfrag','roobet','yalla','exort','galaxy battle','copenhagen','ibuypower','cs_summit','faceit','epicenter','eleague'];
const orgOf=n=>{n=(n||'').toLowerCase();for(const k of ORGS)if(n.includes(k))return k==='starseries'?'starladder':k;return ''};
const ORG_LOGO={};D.ev.slice().sort((a,b)=>(a[4]||0)-(b[4]||0)).forEach(e=>{if(img(e[3])){const k=orgOf(e[2]);if(k)ORG_LOGO[k]=e[3]}});
const evLogoIdx=e=>img(e[3])?e[3]:ORG_LOGO[orgOf(e[2])];
const EV=i=>{const e=D.ev[i];return e?{id:e[0],slug:e[1],name:e[2],logo:img(evLogoIdx(e)),start:e[4]?new Date(e[4]*6e4):null,end:e[5]?new Date(e[5]*6e4):null}:null};
const teamsById={};Object.values(D.teams).forEach(t=>{teamsById[D.tms[t.t][0]]=t});
const tIdxById={};D.tms.forEach((t,i)=>tIdxById[t[0]]=i);
const rankById={};D.ranking.forEach(r=>rankById[D.tms[r[1]][0]]=r);
const vrsById={};D.valve.forEach(v=>vrsById[D.tms[v[1]][0]]=v);
const MONGOLZ=6248;
const TZ='Asia/Ulaanbaatar';
const fmtD=d=>d?d.toLocaleDateString('en-CA',{timeZone:TZ,month:'2-digit',day:'2-digit'}).replace('-','.'):'';
const fmtDY=d=>d?d.toLocaleDateString('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).replace(/-/g,'.'):'';
const fmtT=d=>d.toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const range=(a,b)=>!a?'':(fmtD(a)+(b&&fmtD(b)!==fmtD(a)?' – '+fmtD(b):''));
const logo=(src,cls,alt)=>src?`<img class="logo ${cls||''}" src="${esc(src)}" alt="${esc(alt||'')}" loading="lazy">`:`<span class="logo ph ${cls||''}">${esc((alt||'?').slice(0,2))}</span>`;
const chg=c=>{if(!c||c==='-')return '<span class="flat">–</span>';if(/NEW/i.test(c))return '<span class="up">ШИНЭ</span>';const n=+c;return n>0?`<span class="up">▲${n}</span>`:`<span class="down">▼${-n}</span>`};
const teamHref=id=>teamsById[id]?'#team-'+id:null;
const evById={};D.ev.forEach((e,i)=>evById[e[0]]=i);
const regionMn={EU:'Европ',AM:'Америк',AS:'Ази'};
const TROPHY=(cls,size)=>`<svg class="trophy-ic ${cls||''}" width="${size||22}" height="${size||22}" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="tg-${cls||'x'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--t-hi)"/><stop offset="1" stop-color="var(--t-lo)"/></linearGradient></defs><path fill="url(#tg-${cls||'x'})" d="M18 6h28v6h10v6c0 9-6 15-13 16-2 5-6 8-9 9v7h9v8H21v-8h9v-7c-3-1-7-4-9-9C14 33 8 27 8 18v-6h10zm-4 12c0 5 3 9 6 10-1-3-2-6-2-10zm36 0h-4c0 4-1 7-2 10 3-1 6-5 6-10z"/></svg>`;
const placeCls=p=>/^1st/.test(p)?'gold':/^2nd/.test(p)?'silver':/^3/.test(p)?'bronze':'black';
const placeMn=p=>{if(!p)return '';return p.replace(/^1st$/,'1-р байр').replace(/^2nd$/,'2-р байр').replace(/^3rd$/,'3-р байр').replace(/^(\d+)-(\d+)th$/,'$1–$2-р байр').replace(/^(\d+)th$/,'$1-р байр').replace('1/4 final','1/4 финал').replace('1/2 final','1/2 финал').replace('Group stage','Хэсгийн шат')};

document.getElementById('foot').innerHTML=`<div class="foot-seal"><i aria-hidden="true"></i><div><span class="foot-credit">© 2026 · Хөгжүүлсэн Adiya</span></div></div>`;

/* ---------- ranking ---------- */
let rankMode='hltv',rankReg='all';
const REG=D.reg||{};
const regOf=id=>REG[id]||(vrsById[id]?vrsById[id][3]:'');
function viewRanking(){
  const all=rankMode==='hltv'?D.ranking.map(r=>{const t=TM(r[1]);return {t,pos:r[0],change:r[3],pts:r[2],other:r[4],otherPts:r[5],region:r[6],players:r[7].map(p=>p[0])}})
    :D.valve.map(v=>{const t=TM(v[1]);const hr=rankById[t.id];return {t,pos:v[0],pts:v[2],other:hr?hr[0]:null,region:v[3],players:v[4]}});
  const cnt=r=>all.filter(x=>regOf(x.t.id)===r).length;
  const rows=rankReg==='all'?all:all.filter(x=>regOf(x.t.id)===rankReg);
  app.innerHTML=`${liveStrip()}
  <div class="row-head">
    <div><div class="eyebrow">Counter-Strike 2 · Дэлхийн ранкинг</div><h1>${rankMode==='hltv'?'HLTV ранк':'Valve ранк (VRS)'}</h1>
    <div class="sub">${rankMode==='hltv'?`HLTV-ийн долоо хоног бүрийн ранк, ${esc(D.hltvDate)}. Сүүлийн 2 сарын үзүүлэлт, LAN тэмцээнүүд дээр үндэслэнэ.`:'Valve-ийн албан ёсны Regional Standings. Мэйжор болон томоохон тэмцээний урилгыг энэ ранкээр тогтооно.'}</div></div>
    <div class="seg" role="tablist"><button id="m-h" class="${rankMode==='hltv'?'on':''}">HLTV ранк</button><button id="m-v" class="${rankMode==='valve'?'on':''}">Valve ранк</button></div>
  </div>
  <div class="row-head"><div class="seg" id="regseg">${[['all','Бүх дэлхий',all.length],['EU','Европ',cnt('EU')],['AM','Америк',cnt('AM')],['AS','Ази',cnt('AS')]].map(([k,n,c])=>`<button data-r="${k}" class="${rankReg===k?'on':''}">${n} <span class="num sub">${c}</span></button>`).join('')}</div>${rankReg!=='all'?`<span class="sub">${esc(regionMn[rankReg])} бүсийн багууд, дэлхийн ранкийн дарааллаар · бүсийн байр зүүн талд</span>`:''}</div>
  <div class="legend"><span><i class="dot" style="background:var(--hltv)"></i>HLTV ранк / оноо</span><span><i class="dot" style="background:var(--vrs)"></i>Valve (VRS) ранк / оноо</span><span><i class="dot" style="background:var(--mn)"></i>Монгол баг</span></div>
  <div class="panel rank-list">${rows.length?'':'<div class="empty">Энэ бүсэд баг алга.</div>'}${rows.map((r,ri)=>{
    const mn=r.t.id===MONGOLZ;
    const ob=rankMode==='hltv'
      ?`<span class="badge h num">${r.pts} оноо</span>${r.other?`<span class="badge v num" title="Valve ранк">VRS #${r.other}</span>`:'<span class="badge num" title="Valve ранкийн эхний 60-д байхгүй">VRS –</span>'}`
      :`<span class="badge v num">${r.pts} оноо</span>${r.region?`<span class="badge num">${esc(regionMn[r.region]||r.region)}</span>`:''}${r.other?`<span class="badge h num" title="HLTV ранк">HLTV #${r.other}</span>`:''}`;
    return `<div class="rk flagged ${mn?'rk-mn':''} " data-id="${r.t.id}" tabindex="0" role="link">${fbg(flagOfTeam(r.t.id))}
      <div class="pos num" style="color:${rankMode==='hltv'?'var(--hltv)':'var(--vrs)'}">#${rankReg==='all'?r.pos:ri+1}${rankReg!=='all'?`<div class="sub" style="font:500 11px var(--f-mono)">дэлхий #${r.pos}</div>`:''}</div>
      <div class="chg num">${rankMode==='hltv'?chg(r.change):''}</div>
      ${logo(r.t.logo,'',r.t.name)}
      <div class="nm"><b>${esc(r.t.name)}</b>${mn?' <span class="badge mn">MN</span>':''}<div class="pl">${r.players.map(esc).join(' · ')}</div></div>
      <div class="pts">${ob}</div></div>`}).join('')}</div>`;
  document.getElementById('m-h').onclick=()=>{rankMode='hltv';viewRanking()};
  document.getElementById('m-v').onclick=()=>{rankMode='valve';viewRanking()};
  app.querySelectorAll('#regseg button').forEach(b=>b.onclick=()=>{rankReg=b.dataset.r;viewRanking()});
  app.querySelectorAll('.rk').forEach(el=>{const go=()=>openTeam(+el.dataset.id);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}});
}
function openTeam(id){
  if(id)location.hash='team-'+id;

}

/* ---------- events ---------- */
// which tracked teams play each event
const evTeams={};
Object.values(D.teams).forEach(t=>{const me=D.tms[t.t][0];
  t.evUp.forEach(([ei])=>{(evTeams[D.ev[ei][0]]=evTeams[D.ev[ei][0]]||new Map()).set(me,null)});
  t.evEnd.forEach(([ei,pl])=>{(evTeams[D.ev[ei][0]]=evTeams[D.ev[ei][0]]||new Map()).set(me,pl||null)});
});
const nameToId={};D.tms.forEach(t=>{if(!(t[2] in nameToId))nameToId[t[2]]=t[0]});
let evMode='ongoing';
function evCard(e){const ev=EV(e[0]);const det=D.evDetail&&D.evDetail[ev.id];const ids=new Set([...(det?det.teams.map(x=>x[0]>=0?D.tms[x[0]][0]:0).filter(Boolean):[]),...(evTeams[ev.id]?.keys()||[]),...((e[9]||[]).map(n=>nameToId[n]).filter(Boolean))]);
  const lg=[...ids].sort((a,b)=>(rankById[a]?.[0]||999)-(rankById[b]?.[0]||999)).slice(0,10).map(id=>{const t=TM(tIdxById[id]);return logo(t.logo,'sm',t.name).replace('<img','<img title="'+esc(t.name)+'"')}).join('');
  return `<div class="panel ev" data-ev="${ev.id}" tabindex="0" role="link">${logo(ev.logo,'',ev.name)}<div style="min-width:0">
    <h3>${esc(ev.name)}</h3>
    <div class="meta"><span class="num">${range(ev.start,ev.end)}</span>${e[1]==='ongoing'?'<span class="badge live">ШУУД</span>':''}${e[3]||/LAN/i.test(e[8]||'')?'<span>LAN</span>':(e[8]?`<span>${esc(e[8]==='Online'?'Онлайн':e[8])}</span>`:'')}${e[4]?`<span>${esc(e[4])}</span>`:''}${e[6]&&e[6]!=='Other'?`<span class="num">${esc(e[6])}</span>`:''}${e[7]&&e[7]!=='TBA'?`<span>${esc(e[7])} баг</span>`:''}</div>
    ${lg?`<div class="tlogos">${lg}</div>`:''}</div></div>`}
function viewEvents(){
  const on=D.evts.filter(e=>e[1]==='ongoing'),up=D.evts.filter(e=>e[1]!=='ongoing');
  const big=up.filter(e=>e[2]),small=up.filter(e=>!e[2]);
  let body='';
  if(evMode==='ongoing')body=on.length?`<div class="ev-grid">${on.map(evCard).join('')}</div>`:'<div class="panel empty">Одоогоор явагдаж буй тэмцээн алга.</div>';
  if(evMode==='upcoming')body=`<h2>Томоохон тэмцээнүүд</h2><div class="ev-grid">${big.map(evCard).join('')}</div><h2>Бусад удахгүй болох</h2><div class="ev-grid">${small.map(evCard).join('')}</div>`;
  if(evMode==='mn'){

function rankChart(pts){
  if(!pts||pts.length<2)return '<div class="empty">Ранкийн түүх алга.</div>';
  const W=640,Hh=220,L=36,R=12,T=14,B=28;
  const vals=pts.flatMap(p=>[p[1],p[2]]).filter(v=>v!=null&&v>0);const max=Math.max(5,Math.ceil(Math.max(...vals)/5)*5);
  const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(v-1)*(Hh-T-B)/(max-1);
  const line=(k,c)=>{let d='',pen=false;pts.forEach((p,i)=>{if(p[k]==null||p[k]<=0){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1);pen=true});const li=pts.length-1;const end=pts[li][k]>0?`<circle cx="${x(li)}" cy="${y(pts[li][k])}" r="4" fill="${c}"/>`:'';return `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>${end}`};
  const ticks=[1,...[0.25,0.5,0.75,1].map(f=>Math.round(1+f*(max-1)))].filter((v,i,a)=>a.indexOf(v)===i);
  const step=Math.ceil(pts.length/6);
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Ранкийн хөгжил">
   ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">#${v}</text>`).join('')}
   ${pts.map((p,i)=>i%step===0||i===pts.length-1?`<text x="${x(i)}" y="${Hh-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${esc(p[0].replace(/^\d+ (\w+) \d\d(\d\d)$/,"$1 '$2"))}</text>`:'').join('')}
   ${line(2,'var(--vrs)')}${line(1,'var(--hltv)')}</svg>`;
}

/* ---------- Supabase realtime (standalone site; skipped when config.js is absent) ---------- */
(async()=>{const C=window.FB_SUPABASE;if(!C||!C.url||!C.anonKey)return;
  try{
    await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
    const sb=window.supabase.createClient(C.url,C.anonKey);
    const apply=r=>{if(!r||!r.k)return;if(r.k==='now'){HL=r.v;pickLive()}else if(r.k==='pnow'){PN=r.v;pickLive()}else if(r.k==='news'){NEWS=r.v;rerender()}else if(r.k.startsWith('m:')){MATCH[r.k.slice(2)]=r.v;rerender()}else if(r.k.startsWith('e:')){EVB[r.k.slice(2)]=r.v;if(route.last==='event-'+r.k.slice(2))rerender()}else if(r.k.startsWith('r:')){RES[r.k.slice(2)]=r.v;if(route.last==='live')rerender()}else if(r.k.startsWith('tm:')){TMAP[r.k.slice(3)]=r.v;if(/^(team|match)-/.test(route.last||''))rerender()}};
    sb.channel('fb-live').on('postgres_changes',{event:'*',schema:'public',table:'live'},p=>{if(p.eventType==='DELETE'){const k=p.old&&p.old.k;if(k&&k.startsWith('m:'))delete MATCH[k.slice(2)];rerender()}else apply(p.new)}).subscribe();
    const {data}=await sb.from('live').select('k,v');(data||[]).forEach(apply);
  }catch(e){console.warn('Supabase realtime unavailable',e)}
})();

  }catch(e){}return ''}

    ${src?`<div class="player"><iframe src="${esc(src)}" title="${esc(feat.name)} шууд дамжуулалт" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:`<a class="player ph-player" href="${esc(feat.url)}" target="_blank" rel="noopener"><span class="playbtn" aria-hidden="true"></span><span>${isLive?`${esc(feat.name)}-г ${esc(feat.prov||'')} дээр үзэх`:`Тоглолт шууд явагдаагүй байна · ${esc(feat.name)} сувгийг ${esc(feat.prov||'')} дээр нээх`}</span></a>`}

  tpl.content.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');const t=h.match(/^\/team\/(\d+)/),m=h.match(/^\/matches\/(\d+)/),pl=h.match(/^\/player\/(\d+)/);a.setAttribute('href',t?'#team-'+t[1]:m?'#match-'+m[1]:pl?'#player-'+pl[1]:'#event-'+id)});
  tpl.content.querySelectorAll('*').forEach(el=>{el.childNodes.forEach(n=>{if(n.nodeType===3){n.textContent=n.textContent.replace(/Upper Bracket/g,'Дээд хаалт').replace(/Lower Bracket/g,'Доод хаалт').replace(/Double Elimination Bracket/g,'Давхар хасагдах шат').replace(/Single Elimination Bracket/g,'Нэг хасагдах шат').replace(/Opening round/g,'Нээлтийн тойрог').replace(/Upper semi-finals/g,'Дээд хагас шигшээ').replace(/Upper final/g,'Дээд финал').replace(/Lower round (\d)/g,'Доод $1-р тойрог').replace(/Lower semi-finals/g,'Доод хагас шигшээ').replace(/Lower final/g,'Доод финал').replace(/Consolidation final/g,'Байр шалгаруулах финал').replace(/Grand final/g,'Их финал').replace(/Quarter-finals?/g,'Шөвгийн 8').replace(/Semi-finals?/g,'Хагас шигшээ').replace(/Group ([A-H])/g,'$1 хэсэг').replace(/Monday/g,'Даваа').replace(/Tuesday/g,'Мягмар').replace(/Wednesday/g,'Лхагва').replace(/Thursday/g,'Пүрэв').replace(/Friday/g,'Баасан').replace(/Saturday/g,'Бямба').replace(/Sunday/g,'Ням')}})});
  return `<div class="panel brk">${tpl.innerHTML}</div><div class="sub" style="font-size:12px">Шинэчилсэн ${esc(fmtT(new Date(b.updated)))} (${ago(b.updated)})</div>`;

function todayMatches(){
  const today=ubDay(Date.now());const seen=new Set();const out=[];
  Object.values(D.teams).forEach(t=>t.up.forEach(m=>{const at=m[0]*6e4;if(ubDay(at)!==today)return;const key=m[3]||(t.t+'-'+m[0]);if(seen.has(key))return;seen.add(key);
    const a=D.tms[t.t],b=D.tms[m[2]]||[0,'','TBD'];const ev=D.ev[m[1]];
    out.push({id:+(String(m[3]).split('/')[0])||0,path:m[3],ev:ev?ev[0]:0,evName:ev?ev[2]:'',t1:[a[0],a[2]],t2:[b[0],b[2]],bo:'',time:m[0],stars:0})}));
  return out.sort((x,y)=>x.time-y.time);

/* ---------- bracket built from the matches we know (groups via who-played-whom, upper/lower via losses) ---------- */
function builtBracket(ms){
  const list=ms.slice().sort((x,y)=>x.d-y.d);
  // groups: union teams chronologically; a match that would join two groups of 3+ teams is a playoff match
  const par={};const find=x=>par[x]===undefined?(par[x]=x):par[x]===x?x:(par[x]=find(par[x]));const size={};
  const sz=x=>size[find(x)]||1;
  const playoff=new Set();
  list.forEach((m,i)=>{const ra=find(m.a),rb=find(m.b);if(ra===rb)return;if(sz(ra)>=3&&sz(rb)>=3){playoff.add(i);return}const n=sz(ra)+sz(rb);par[ra]=rb;size[rb]=n});
  const W={},L={},P={};
  const nodes=list.map((m,i)=>{const a=m.a,b=m.b;const st=[L[a]||0,L[b]||0];const rnd=Math.max(P[a]||0,P[b]||0)+1;
    let lane=playoff.has(i)?'po':(st[0]===0&&st[1]===0?'up':(st[0]>0&&st[1]>0?'lo':'dec'));
    P[a]=(P[a]||0)+1;P[b]=(P[b]||0)+1;
    if(m.done){const aw=+m.sa>+m.sb;const w=aw?a:b,l=aw?b:a;W[w]=(W[w]||0)+1;L[l]=(L[l]||0)+1}
    return {m,lane,rnd,g:playoff.has(i)?'po':find(a)}});
  const groups=[...new Set(nodes.filter(n=>n.g!=='po').map(n=>n.g))];
  const box=n=>{const m=n.m;const ta=TM(m.a),tb=TM(m.b);const dt=new Date(m.d*6e4);const aw=m.done&&+m.sa>+m.sb,bw=m.done&&+m.sb>+m.sa;
    const row=(t,sc,win,lose)=>`<a class="bt ${win?'win':''} ${lose?'lose':''}" href="#team-${t.id}">${logo(t.logo,'sm',t.name)}<span>${esc(t.name)}</span><b class="num">${m.done?esc(sc):''}</b></a>`;
    return `<div class="bm"><div class="bm-h"><span class="num">${fmtD(dt)} ${fmtT(dt)}</span>${m.id?`<a href="#match-${esc(String(m.id).split('/')[0])}">${m.done?'Дууссан':'Удахгүй'}</a>`:''}</div>${row(ta,m.sa,aw,bw)}${row(tb,m.sb,bw,aw)}</div>`};
  const laneName={up:'Дээд хаалт',lo:'Доод хаалт',dec:'Шийдвэрлэх тоглолт',po:'Плей-офф'};
  const roundName=(lane,r,max)=>lane==='up'?(r===1?'Нээлтийн тойрог':'Дээд тойрог '+r):lane==='lo'?'Доод тойрог '+(r-1):lane==='dec'?'Шийдвэрлэх':(r===max?'Финал':r===max-1?'Хагас шигшээ':'Тойрог '+r);
  const laneHtml=(ns,lane)=>{const rs=[...new Set(ns.map(n=>n.rnd))].sort((a,b)=>a-b);if(!rs.length)return '';const max=rs[rs.length-1];
    return `<div class="blane"><div class="blane-t">${laneName[lane]}</div><div class="bcols">${rs.map(r=>`<div class="bcolumn"><div class="bcol-t">${roundName(lane,r,max)}</div>${ns.filter(n=>n.rnd===r).map(box).join('')}</div>`).join('')}</div></div>`};
  const groupHtml=(g,gi)=>{const ns=nodes.filter(n=>n.g===g);const teams=[...new Set(ns.flatMap(n=>[n.m.a,n.m.b]))];
    const table=teams.map(t=>({t,w:W[t]||0,l:L[t]||0})).sort((x,y)=>(y.w-x.w)||(x.l-y.l));
    const adv=table.filter(x=>x.w>=2).map(x=>x.t),out=table.filter(x=>x.l>=2).map(x=>x.t);
    return `<div class="bgroup"><div class="bgroup-h"><b>${String.fromCharCode(65+gi)} хэсэг</b>${adv.length?`<span class="badv">Гарсан: ${adv.map(t=>esc(TM(t).name)).join(', ')}</span>`:''}${out.length?`<span class="bout">Хасагдсан: ${out.map(t=>esc(TM(t).name)).join(', ')}</span>`:''}</div>
      ${laneHtml(ns.filter(n=>n.lane==='up'),'up')}${laneHtml(ns.filter(n=>n.lane==='lo'),'lo')}${laneHtml(ns.filter(n=>n.lane==='dec'),'dec')}</div>`};
  const po=nodes.filter(n=>n.g==='po');
  return `<div class="panel brk2">${groups.map(groupHtml).join('')}${po.length?`<div class="bgroup">${laneHtml(po,'po')}</div>`:''}
    <div class="sub" style="font-size:12px">Багуудын тоглолтын түүхээс бүтээв: эхний тоглолтоо хожсон баг дээд, хожигдсон баг доод хаалтад. 2 ялалттай баг группээс гарна, 2 ялагдалтай баг хасагдана.</div></div>`;
}

/* ---------- head-to-head from both teams' recent results ---------- */
function h2hList(aId,bId){const seen=new Set(),out=[];
  const add=(arr,flip)=>(arr||[]).forEach(r=>{const o=TM(r[2]);const other=flip?aId:bId;if(o.id!==other)return;const k=String(r[5]||r[0]);if(seen.has(k))return;seen.add(k);
    out.push({d:r[0],e:r[1],a:flip?+r[4]:+r[3],b:flip?+r[3]:+r[4],id:r[5]})});
  add(teamsById[aId]?.res,false);add(teamsById[bId]?.res,true);
  return out.sort((x,y)=>y.d-x.d)}
function h2hHtml(aId,bId,aName,bName){
  if(!aId||!bId)return '';const L=h2hList(aId,bId);
  const aw=L.filter(m=>m.a>m.b).length,bw=L.filter(m=>m.b>m.a).length,n=aw+bw;
  const ta=tIdxById[aId]!=null?TM(tIdxById[aId]):{logo:''},tb=tIdxById[bId]!=null?TM(tIdxById[bId]):{logo:''};
  return `<h2>Өмнөх уулзалтууд</h2><div class="panel h2h">
   <div class="h2h-top"><a href="#team-${aId}">${logo(ta.logo,'',aName)}<b>${esc(aName)}</b></a>
    <div class="h2h-sc"><span class="num">${aw}</span><i>:</i><span class="num">${bw}</span><small>${n?`${n} тоглолтоос`:'Сүүлийн үед тоглоогүй'}</small></div>
    <a class="r" href="#team-${bId}"><b>${esc(bName)}</b>${logo(tb.logo,'',bName)}</a></div>
   ${n?`<div class="h2h-bar"><i style="width:${aw/n*100}%"></i></div>
   <div class="h2h-list">${L.map(m=>{const e=EV(m.e);const dt=new Date(m.d*6e4);return `<div class="h2h-row"><span class="num sub">${fmtD(dt)}</span><span class="ev">${e?esc(e.name):''}</span><span class="num sc ${m.a>m.b?'w':'l'}">${m.a} : ${m.b}</span><span class="sub">${m.a>m.b?esc(aName):esc(bName)} хожсон</span></div>`}).join('')}</div>`:''}
   <div class="sub" style="font-size:12px">Хоёр багийн сүүлийн 16 тоглолтын үр дүнгээс.</div></div>`}
function oppTable(t){const g={};(t.res||[]).forEach(r=>{const o=TM(r[2]);if(!o.id)return;const x=g[o.id]||(g[o.id]={o,w:0,l:0});(+r[3]>+r[4])?x.w++:x.l++});
  const rows=Object.values(g).sort((a,b)=>(b.w+b.l)-(a.w+a.l)||b.w-a.w);if(!rows.length)return '';
  return `<h2>Өрсөлдөгчидтэй харьцаа</h2><div class="panel tbl-wrap"><table><thead><tr><th>Баг</th><th class="r">Хожсон</th><th class="r">Хожигдсон</th><th class="r">Хувь</th></tr></thead><tbody>
   ${rows.map(x=>`<tr><td><a class="pcell" href="#team-${x.o.id}">${logo(x.o.logo,'sm',x.o.name)}<b>${esc(x.o.name)}</b></a></td><td class="r num" style="color:var(--win)">${x.w}</td><td class="r num" style="color:var(--loss)">${x.l}</td><td class="r num">${Math.round(x.w/(x.w+x.l)*100)}%</td></tr>`).join('')}
   </tbody></table></div><div class="sub" style="font-size:12px">Сүүлийн 16 тоглолтоор.</div>`}

/* ---------- team map stats (rows 'tm:<teamId>' from the collector; last 3 months on HLTV) ---------- */
const mapRows=id=>{const v=TMAP[id];if(!v||!v.maps)return [];
  return v.maps.map(m=>{const n=(+m.w||0)+(+m.d||0)+(+m.l||0);return {n:m.n,w:+m.w||0,d:+m.d||0,l:+m.l||0,p:n,wr:n?Math.round((+m.w||0)/n*100):0,fk:m.fk,fd:m.fd}}).filter(m=>m.p>0)};
const bestMap=rows=>{const ok=rows.filter(m=>m.p>=3);const pool=ok.length?ok:rows;return pool.slice().sort((a,b)=>b.wr-a.wr||b.p-a.p)[0]};
const mapPeriod=v=>v&&v.from?`${esc(v.from)} – ${esc(v.to)}`:'бүх хугацаа';
const mapEmpty=`<div class="panel empty">Мапын статистик хараахан ирээгүй байна. HLTV дээр энэ багийн хуудсыг нээхэд COREX TV collector автоматаар илгээнэ.</div>`;
const MAPC={mirage:'#2f6fae',dust2:'#2a8f8a',nuke:'#2f8f5b',ancient:'#3f9a54',anubis:'#6c9a3a',overpass:'#9a9a32',vertigo:'#b8962e',train:'#c98a24',cache:'#c46a1e',inferno:'#a8321f'};
const mapKey=n=>String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'').replace('de_','');
function mapStatsHtml(id){
  const rows=mapRows(id);if(!rows.length)return `<h2>Мап</h2>${mapEmpty}`;
  const best=bestMap(rows);const byP=rows.slice().sort((a,b)=>b.p-a.p);const byW=rows.slice().sort((a,b)=>b.wr-a.wr||b.p-a.p);
  const max=Math.max(...byP.map(m=>m.p));const step=max>100?50:max>40?20:max>20?10:5;const top=Math.ceil(max/step)*step||step;
  const ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
  return `<h2>Мап</h2><div class="mapbd">
   <div class="panel mb-dist"><div class="mb-h">Тоглосон мапын тархалт</div>
    <div class="mb-chart">${byP.map(m=>`<div class="mb-row"><span class="mb-n">${esc(m.n)}</span><span class="mb-track" style="--x:${m.p/top*100}%"><i style="width:${m.p/top*100}%;background:${MAPC[mapKey(m.n)]||'var(--accent)'}"></i><b class="num">${m.p}</b></span></div>`).join('')}
     <div class="mb-axis"><span></span><span class="mb-ticks">${ticks.map(v=>`<i class="num" style="left:${v/top*100}%">${v}</i>`).join('')}</span></div></div></div>
   <div class="panel mb-hl"><div class="mb-h">Мапын онцлох · ялалтын хувь</div>
    ${byW.map(m=>{const r=D.radar&&D.radar[mapKey(m.n)];const c=MAPC[mapKey(m.n)]||'#8E3B2B';
      return `<div class="mb-strip ${m===best?'best':''}" style="--mc:${c}">${r&&r.src?`<span class="mb-img" style="background-image:url('${esc(r.src)}')"></span>`:''}<span class="mb-lbl"><b>${esc(m.n)}</b> – <span class="num">${m.wr.toFixed?m.wr.toFixed(1):m.wr}%</span></span><span class="mb-wl num">${m.w}-${m.d?m.d+'-':''}${m.l}</span></div>`}).join('')}</div>
  </div><div class="sub" style="font-size:12px">Хугацаа: ${mapPeriod(TMAP[id])}. Хамгийн сайн мап: <b>${esc(best.n)}</b> (${best.wr}%, ${best.p} мап).</div>`}
function mapCompareHtml(aId,bId,aName,bName){
  if(!aId||!bId)return '';const A=mapRows(aId),B=mapRows(bId);
  if(!A.length&&!B.length)return `<h2>Мапын харьцуулалт</h2>${mapEmpty.replace('энэ багийн хуудсыг','энэ тоглолтын хуудсыг')}`;
  const names=[...new Set([...A,...B].map(m=>m.n))];const get=(L,n)=>L.find(m=>m.n===n);
  const rows=names.map(n=>({n,a:get(A,n),b:get(B,n)})).sort((x,y)=>((y.a?.p||0)+(y.b?.p||0))-((x.a?.p||0)+(x.b?.p||0)));
  const cell=(m,side)=>m?`<span class="num">${m.wr}%</span><span class="sub num">${m.w}-${m.l}</span>`:`<span class="sub">—</span>`;
  const ba=bestMap(A),bb=bestMap(B);
  return `<h2>Мапын харьцуулалт</h2><div class="panel mapcmp">
   <div class="mc-head"><b>${esc(aName)}</b><span class="sub">Мап</span><b class="r">${esc(bName)}</b></div>
   ${rows.map(r=>{const aw=r.a&&(!r.b||r.a.wr>r.b.wr),bw=r.b&&(!r.a||r.b.wr>r.a.wr);return `<div class="mc-row"><div class="mc-a ${aw?'up':''}">${cell(r.a)}<span class="mc-bar l"><i style="width:${r.a?r.a.wr:0}%"></i></span></div><div class="mc-n">${esc(r.n)}</div><div class="mc-b ${bw?'up':''}"><span class="mc-bar"><i style="width:${r.b?r.b.wr:0}%"></i></span>${cell(r.b)}</div></div>`}).join('')}
   <div class="mc-foot"><span>${ba?`${esc(aName)}: <b>${esc(ba.n)}</b>`:''}</span><span>${bb?`${esc(bName)}: <b>${esc(bb.n)}</b>`:''}</span></div>
   <div class="sub" style="font-size:12px">Хоёр багийн сүүлийн 3 сарын мапын ялалтын хувь. Тод нь тухайн мап дээр илүү сайн нь.</div></div>`}

/* ---------- results of the last 14 days: collector rows 'r:<id>' first, team histories fill the rest ---------- */
const DAY14=14*864e5;
function recentResults(){
  const out=new Map(),cut=Date.now()-DAY14;
  Object.values(RES).forEach(r=>{const t=Date.parse(r.ended||0);if(t<cut)return;out.set(String(r.id),{id:r.id,t,ev:r.ev,evName:r.evName,a:LT(r.t1),b:LT(r.t2),s1:+r.s1||0,s2:+r.s2||0,maps:r.maps||[],bo:r.bo||''})});
  Object.values(D.teams).forEach(t=>(t.res||[]).forEach(r=>{const at=r[0]*6e4;if(at<cut)return;const id=String(r[5]||'');if(!id||out.has(id))return;
    const me=TM(t.t),op=TM(r[2]);const e=EV(r[1]);out.set(id,{id:+id,t:at,ev:e?e.id:0,evName:e?e.name:'',a:{id:me.id,name:me.name,logo:me.logo},b:{id:op.id,name:op.name,logo:op.logo},s1:+r[3],s2:+r[4],maps:[],bo:''})}));
  return [...out.values()].sort((x,y)=>y.t-x.t)}
function resultsHtml(mnOnly){
  let L=recentResults();if(mnOnly)L=L.filter(m=>isMnTeam(m.a.id)||isMnTeam(m.b.id));
  if(!L.length)return '';
  const days=[];L.forEach(m=>{const d=ubDay(m.t);let g=days[days.length-1];if(!g||g.d!==d){g={d,t:m.t,ms:[]};days.push(g)}g.ms.push(m)});
  const row=m=>{const aw=m.s1>m.s2,bw=m.s2>m.s1;const tl=(t,r,w)=>{const inner=r?`<span>${esc(t.name)}</span>${logo(t.logo,'sm',t.name)}`:`${logo(t.logo,'sm',t.name)}<span>${esc(t.name)}</span>`;return `<a class="t ${r?'r':''} ${w?'w':'l'}" href="#team-${t.id}">${inner}</a>`};
    return `<div class="mrow rrow ${isMnTeam(m.a.id)||isMnTeam(m.b.id)?'mnm':''}"><span class="dt num sub">${fmtT(new Date(m.t))}</span>${tl(m.a,1,aw)}<span class="sc num"><b class="${aw?'w':''}">${m.s1}</b>:<b class="${bw?'w':''}">${m.s2}</b></span>${tl(m.b,0,bw)}<a class="evn" href="#event-${m.ev}">${esc(m.evName)}${m.maps.length?` · <span class="sub">${m.maps.map(x=>esc(x.n)+' '+esc(x.s1)+':'+esc(x.s2)).join(', ')}</span>`:''}</a></div>`};
  return `<details class="panel mlist resfold" ${resOpen?'open':''} id="resfold"><summary>Сүүлийн 14 хоногийн үр дүн <span class="cnt">${L.length}</span></summary><div class="upfold-b">
    ${days.map(g=>`<div class="resday"><div class="evhdr">${esc(fmtDY(new Date(g.t)))}</div>${g.ms.map(row).join('')}</div>`).join('')}</div></details>`}
let resOpen=false;

/* ---------- brackets from HLTV's own bracket JSON (rows 'e:<id>' with .brk) ---------- */
const RNAME={'Opening round':'Нээлтийн тойрог','Quarter-finals':'Шөвгийн 8','Semi-finals':'Хагас шигшээ','Grand final':'Их финал','Grand Final':'Их финал','Final':'Финал','Upper bracket final':'Дээд хаалтын финал','Upper final':'Дээд хаалтын финал','Lower bracket final':'Доод хаалтын финал','Lower final':'Доод хаалтын финал','Elimination match':'Хасагдах тоглолт','Decider match':'Шийдвэрлэх тоглолт','Winners\' match':'Хожигчдын тоглолт','Upper semi-finals':'Дээд хагас шигшээ','Lower round 1':'Доод тойрог 1','Lower round 2':'Доод тойрог 2','Round of 16':'Шөвгийн 16','3rd place decider':'3-р байрын тоглолт','Consolidation final':'3-р байрын тоглолт','Tiebreaker':'Тайбрейк','Final match':'Финал','Semifinals':'Хагас шигшээ','Quarterfinals':'Шөвгийн 8'};
const BNAME={'Single Elimination Bracket':'Плей-офф','3rd Place Decider Match':'3-р байрын тоглолт','Playoffs':'Плей-офф','Playoff Bracket':'Плей-офф'};
const rMn=n=>RNAME[n]||n;
const BTYPE={SingleElimination:'Шууд хасах шат',DoubleElimination4:'Давхар хасах (GSL)',DoubleElimination8:'Давхар хасах шат',DoubleElimination16:'Давхар хасах шат'};
const LANEMN={up:'Дээд хаалт',lo:'Доод хаалт',gf:'Финал',cf:'3-р байр','':''};
function jsonBracket(brk){
  const team=(t,sc,win,lose)=>{if(!t)t={id:0,name:'TBD',logo:''};const known=t.id&&tIdxById[t.id]!=null;const tm=known?TM(tIdxById[t.id]):null;const lg=(tm&&tm.logo)||t.logo;
    const inner=`${lg?`<img class="logo sm" src="${esc(lg)}" alt="" loading="lazy">`:'<span class="logo sm ph">?</span>'}<span>${esc(t.name||'TBD')}</span><b class="num">${sc==null?'':esc(sc)}</b>`;
    return t.id?`<a class="bt ${win?'win':''} ${lose?'lose':''}" href="#team-${t.id}">${inner}</a>`:`<span class="bt tbd">${inner}</span>`};
  const box=sl=>{const dt=sl.time?new Date(sl.time):null;const done=!!sl.s;
    return `<div class="bm"><div class="bm-h"><span class="num">${dt?fmtD(dt)+' '+fmtT(dt):''}</span>${sl.mid?`<a href="#match-${sl.mid}">${done?'Дууссан':sl.bo?'BO'+sl.bo:'Тоглолт'}</a>`:''}</div>${team(sl.t[0],sl.s?sl.s[0]:null,sl.w===1,sl.w===2)}${team(sl.t[1],sl.s?sl.s[1]:null,sl.w===2,sl.w===1)}</div>`};
  const lanes=b=>{const ls=[...new Set(b.rounds.map(r=>r.lane))];return ls.map(l=>{const rs=b.rounds.filter(r=>r.lane===l);
    return `<div class="blane">${LANEMN[l]?`<div class="blane-t">${LANEMN[l]}</div>`:''}<div class="bcols">${rs.map(r=>`<div class="bcolumn"><div class="bcol-t">${esc(rMn(r.name))}</div>${r.slots.map(box).join('')}</div>`).join('')}</div></div>`}).join('')};
  const adv=b=>{if(!/DoubleElimination4/.test(b.type))return '';const out=[],up=[];b.rounds.forEach(r=>r.slots.forEach(sl=>{if(!sl.w)return;const W=sl.t[sl.w-1],Lz=sl.t[2-sl.w];if(sl.win&&!/ToNextRound|ToLower|EventWinner/.test(sl.win)&&W)up.push(W.name);if(/Eliminated/.test(sl.lose)&&Lz)out.push(Lz.name)}));
    return (up.length?`<span class="badv">Гарсан: ${up.map(esc).join(', ')}</span>`:'')+(out.length?`<span class="bout">Хасагдсан: ${out.map(esc).join(', ')}</span>`:'')};
  return `<div class="panel brk2">${brk.map(b=>`<div class="bgroup"><div class="bgroup-h"><b>${esc(BNAME[b.name]||(/^Group /.test(b.name)?b.name.replace(/^Group /,'')+' хэсэг':b.name))}</b><span class="sub" style="font-size:12px">${esc(BTYPE[b.type]||'')}</span>${adv(b)}</div>${lanes(b)}</div>`).join('')}
   <div class="sub" style="font-size:12px">HLTV-ийн тэмцээний шатнаас. Тоглолт дуусах бүрт шинэчлэгдэнэ.</div></div>`}

/* ---------- search ---------- */
const q=document.getElementById('q'),sres=document.getElementById('sres');
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(!s){sres.hidden=true;return}
  const hits=D.tms.filter(t=>t[2].toLowerCase().includes(s)).sort((a,b)=>(rankById[a[0]]?.[0]||999)-(rankById[b[0]]?.[0]||999)).slice(0,10);
  sres.innerHTML=hits.length?hits.map(t=>{const r=rankById[t[0]];return `<a href="#" data-team="${t[0]}">${logo(img(t[3]),'sm',t[2])}<span>${esc(t[2])}</span><span class="sub num" style="margin-left:auto;font-size:12px">${r?'#'+r[0]:''}</span></a>`}).join(''):'<div class="empty">Олдсонгүй</div>';
  sres.hidden=false;
  sres.querySelectorAll('[data-team]').forEach(a=>a.onclick=e=>{e.preventDefault();sres.hidden=true;q.value='';openTeam(+a.dataset.team)});
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))sres.hidden=true});

/* ---------- router ---------- */
function rerender(){if(!route.last)return;const y=window.scrollY;const gl=document.querySelector('.glog2');const gy=gl?gl.scrollTop:0;const h=route.last;if(h==='live'||h==='news'||/^(team|match|event)-/.test(h)||h==='ranking'||h==='valve'){render(h);window.scrollTo(0,y);const g2=document.querySelector('.glog2');if(g2)g2.scrollTop=gy}}
/* ---------- side rails (wide screens): live + today on the left, Mongolian teams + news on the right ---------- */
function renderRails(){
  const L=document.getElementById('railL'),R=document.getElementById('railR');if(!L||!R||!matchMedia('(min-width:1700px)').matches)return;
  const mini=(m,live)=>{const a=LT(m.t1),b=LT(m.t2);const c=live?curOf(m):null;const dt=new Date(m.time*6e4);
    return `<a class="rm ${live?'on':''} ${isMnMatch(m)?'mn':''}" href="${m.id?'#match-'+m.id:'#team-'+a.id}"><span class="rm-t">${live?'<span class="pulse"></span>ШУУД':esc(fmtT(dt))}</span>
      <span class="rm-r">${logo(a.logo,'sm',a.name)}<b>${esc(a.name)}</b><i class="num">${live?esc(c.a):''}</i></span>
      <span class="rm-r">${logo(b.logo,'sm',b.name)}<b>${esc(b.name)}</b><i class="num">${live?esc(c.b):''}</i></span></a>`};
  const old=liveOld();const lv=old?[]:dedupe(LIVE?.live);const fu=dedupe(LIVE?.up).filter(m=>!old||m.time*6e4>Date.now()-3*3600e3);const up=fu.length?fu:todayMatches().filter(m=>m.time*6e4>Date.now()-3*3600e3);
  L.innerHTML=`<div class="rail-h">Шууд</div>${lv.length?lv.slice(0,6).map(m=>mini(m,1)).join(''):'<div class="rail-e">Яг одоо тоглолт алга</div>'}
    <div class="rail-h">Удахгүй</div>${up.slice(0,8).map(m=>mini(m,0)).join('')||'<div class="rail-e">Товлогдсон тоглолт алга</div>'}
    <a class="rail-more" href="#live">Бүх тоглолт →</a>`;
  const mn=[...MN_TEAMS].map(id=>({id,r:rankById[id]})).filter(x=>tIdxById[x.id]!=null).sort((a,b)=>(a.r?.[0]||999)-(b.r?.[0]||999));
  const items=((NEWS&&NEWS.items)||[]).slice(0,5);
  R.innerHTML=`<div class="rail-h">Монгол багууд</div>${mn.map(x=>{const t=TM(tIdxById[x.id]);return `<a class="rt" href="#team-${t.id}">${logo(t.logo,'sm',t.name)}<b>${esc(t.name)}</b><span class="num">${x.r?'#'+x.r[0]:'—'}</span></a>`}).join('')}
    <div class="rail-h">Сүүлийн мэдээ</div>${items.map(n=>`<a class="rn" href="#news-${esc(n.href.split('/')[2])}">${esc(n.mn)}</a>`).join('')||'<div class="rail-e">Мэдээ алга</div>'}
    <a class="rail-more" href="#news">Бүх мэдээ →</a>`;
}
addEventListener('resize',()=>renderRails());
setInterval(renderRails,20000);
function render(h){
  setTimeout(renderRails,0);
  let m;
  if((m=h.match(/^team-(\d+)$/)))viewTeam(+m[1]);
  else if((m=h.match(/^event-(\d+)$/)))viewEvent(+m[1]);
  else if(h==='events')viewEvents();
  else if(h==='live')viewLive();
  else if(h==='news')viewNews();
  else if((m=h.match(/^news-(\d+)$/)))viewNewsItem(+m[1]);
  else if((m=h.match(/^match-(\d+)$/)))viewMatch(+m[1]);
  else if((m=h.match(/^player-(\d+)$/)))viewPlayer(+m[1]);
  else if(h==='valve'){rankMode='valve';viewRanking()}
  else viewRanking();
}
function route(){
  const h=location.hash.slice(1)||'ranking';
  if(/^team-/.test(h)&&route.last!==h)teamTab='overview';
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',h===a.dataset.nav||(a.dataset.nav==='ranking'&&/^(team|valve)/.test(h))||(a.dataset.nav==='events'&&/^event/.test(h))||(a.dataset.nav==='news'&&/^news/.test(h))||(a.dataset.nav==='live'&&/^match/.test(h))));
  route.last=h;render(h);window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);route();
})();
</script>
