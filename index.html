<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<title>COREX TV</title>
<script>(function(){var t="light";try{t=localStorage.getItem("corex-theme")||"light"}catch(e){}document.documentElement.setAttribute("data-theme",t)})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20350%20350%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lg-bg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%230b5f8f%22/%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23062b45%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2301080f%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22350%22%20height%3D%22350%22%20rx%3D%2272%22%20fill%3D%22url%28%23lg-bg%29%22/%3E%3Cpath%20fill%3D%22%2300b2f0%22%20d%3D%22M148%2072H283L245%20140H175L135%20210H68Z%22/%3E%3Cpath%20fill%3D%22%2300b2f0%22%20d%3D%22M135%20210H272L232%20278H97Z%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Mongolian&family=Grand+Hotel&family=PT+Serif:wght@400;700&display=swap">
<style>
/* Layout: glass top bar over a night-arena backdrop; one centered column (max 1120px); list rows for rankings, card grid for events, hero + tabs for profiles. Teams sit on faded flag backdrops. */
:root{
  /* parchment palette: илгэн цаас, бор бэх, улаан хүрэн дээл, бүдэг алт, уулын цэнхэр саарал */
  --bg:#EFE4C9; --bg-alt:#E3D3AE; --text:#3A2A1E; --text-soft:#6B5340; --primary:#8E3B2B; --primary-dk:#6E2B1F; --sand:#B8955A; --gray-deel:#A9A48F; --sky:#8D96A3;
  --bg-glow-1:rgba(184,149,90,.22); --bg-glow-2:rgba(142,59,43,.07);
  --panel:rgba(245,237,218,.82); --panel-solid:#F5EDDA; --panel-2:var(--bg-alt); --line:rgba(169,164,143,.6);
  --fg:var(--text); --muted:var(--text-soft); --shadow:0 1px 2px rgba(58,42,30,.08),0 8px 24px rgba(58,42,30,.08);
  --hltv:var(--primary); --vrs:#8a6a2e; --accent:var(--primary); --accent-2:var(--primary-dk);
  --win:#4e7a32; --loss:var(--primary); --live:#a8321f;
  --gold:#a8822f; --silver:#7d7f86; --bronze:#94572c;
  --mn:var(--primary); --ct:#5d6878; --tside:#9a6a14; --flag-op:.62;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,"Segoe UI",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060a12; --bg-glow-1:rgba(47,123,230,.20); --bg-glow-2:rgba(227,176,75,.10);
  --panel:rgba(16,24,40,.74); --panel-solid:#0f1726; --panel-2:rgba(255,255,255,.045); --line:rgba(255,255,255,.08);
  --fg:#eef2f8; --muted:#8e9bb0; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
  --hltv:#4f8ef0; --vrs:#e3b04b; --accent:#4f8ef0; --accent-2:#e0313b;
  --win:#3ddc84; --loss:#ff6b6b; --live:#ff4650;
  --gold:#f2c14e; --silver:#b9c6d6; --bronze:#e0985f; --mn:#ff4650; --ct:#5aa2e6; --tside:#f0b13a; --flag-op:.45;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060a12; --bg-glow-1:rgba(47,123,230,.20); --bg-glow-2:rgba(227,176,75,.10);
  --panel:rgba(16,24,40,.74); --panel-solid:#0f1726; --panel-2:rgba(255,255,255,.045); --line:rgba(255,255,255,.08);
  --fg:#eef2f8; --muted:#8e9bb0; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
  --hltv:#4f8ef0; --vrs:#e3b04b; --accent:#4f8ef0; --accent-2:#e0313b;
  --win:#3ddc84; --loss:#ff6b6b; --live:#ff4650;
  --gold:#f2c14e; --silver:#b9c6d6; --bronze:#e0985f; --mn:#ff4650; --ct:#5aa2e6; --tside:#f0b13a; --flag-op:.45;
  color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(900px 500px at 8% -10%,var(--bg-glow-1),transparent 70%),radial-gradient(800px 500px at 100% 0%,var(--bg-glow-2),transparent 70%);background-repeat:no-repeat;background-attachment:fixed;color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:22px;height:70px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;line-height:1}
.brand i{display:inline-block;width:9px;height:22px;background:linear-gradient(180deg,var(--hltv),color-mix(in srgb,var(--hltv) 50%,var(--accent-2)));transform:skewX(-16deg);border-radius:2px;box-shadow:0 0 14px color-mix(in srgb,var(--hltv) 55%,transparent)}
.brand .emblem{width:40px;height:40px;flex:none;border-radius:10px;filter:drop-shadow(0 3px 10px rgba(0,178,240,.35));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.brand:hover .emblem{transform:translateY(-1px) scale(1.05)}
.brand .wm{display:grid;gap:3px}
.brand .wm-main{font:400 38px/.9 'Grand Hotel','Brush Script MT',cursive;letter-spacing:0;color:var(--fg);padding:0 4px 2px 0}
.brand .wm-main .tv{display:inline-block;padding:0 6px 2px 1px;margin-right:-4px;background:linear-gradient(180deg,#ffe29a,#e3b04b 55%,#b07a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .wm-sub{font:700 9px var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.brand .mgl{font-family:"Noto Sans Mongolian",serif;writing-mode:vertical-lr;font-size:13px;line-height:1.15;color:var(--orn);opacity:.9;height:auto;min-height:44px;overflow:visible;padding-block:2px;border-left:1px solid color-mix(in srgb,var(--orn) 40%,transparent);padding-left:6px}
@media (max-width:760px){.brand .wm-sub,.brand .mgl{display:none}.brand .emblem{width:32px;height:32px}.brand .wm-main{font-size:30px}}

.brand i+i{background:linear-gradient(180deg,var(--vrs),color-mix(in srgb,var(--vrs) 60%,#ff6a3d));margin-left:-6px;box-shadow:0 0 14px color-mix(in srgb,var(--vrs) 45%,transparent)}
nav.main{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
nav.main a{padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;align-items:center;transition:color .15s,background .15s}
nav.main a:hover{color:var(--fg)}
nav.main a.on{color:var(--fg);background:var(--panel-solid);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--line)}
.search{margin-left:auto;position:relative}
.devby{display:grid;gap:2px;padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);white-space:nowrap;transition:border-color .15s,background .15s}
.devby:hover{border-color:color-mix(in srgb,#d62976 55%,var(--line));background:color-mix(in srgb,#d62976 8%,var(--panel-2))}
.devby-l{font:700 9px var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.devby-n{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--f-body);color:var(--fg)}
@media (max-width:900px){.devby-l{display:none}.devby{padding:7px 9px}}
@media (max-width:600px){.devby-n{font-size:0;gap:0}.devby-n svg{width:20px;height:20px}}
.search input{width:220px;max-width:40vw;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--fg);font:500 13px var(--f-body);transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sres{position:absolute;right:0;top:46px;background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--r);width:280px;max-height:340px;overflow:auto;box-shadow:var(--shadow);padding:4px}
.sres a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px}
.sres a:hover{background:var(--panel-2)}
main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
main>*,.stack>*,.two>*{min-width:0}
html,body{overflow-x:clip}
h1,h2,h3{font-weight:700;text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-size:30px;letter-spacing:.01em;line-height:1.15}
h2{font-family:var(--f-display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
h3{font-size:16px;font-family:var(--f-body)}
.sub{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:7px 15px;border-radius:999px;cursor:pointer;transition:color .15s,background .15s}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--panel-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2),0 0 0 1px var(--line)}
.row-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.logo{width:28px;height:28px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.logo.lg{width:96px;height:96px}
.logo.sm{width:20px;height:20px;filter:none}
.ph{display:inline-grid;place-items:center;background:var(--panel-2);border-radius:8px;color:var(--muted);font:700 10px var(--f-body);filter:none}
/* flag backdrops */
.flagged{position:relative;isolation:isolate;overflow:hidden}
.flagbg{position:absolute;z-index:-1;pointer-events:none;background-size:cover;background-position:center;opacity:var(--flag-op)}
.rk .flagbg{left:0;top:0;bottom:0;width:62%;-webkit-mask-image:linear-gradient(90deg,#000 0%,#000 30%,rgba(0,0,0,.6) 60%,transparent 100%);mask-image:linear-gradient(90deg,#000 0%,#000 30%,rgba(0,0,0,.6) 60%,transparent 100%)}
.hero .flagbg{inset:0;width:72%;filter:saturate(1.2);opacity:min(.85,calc(var(--flag-op) * 1.5));-webkit-mask-image:linear-gradient(90deg,#000 10%,transparent 95%);mask-image:linear-gradient(90deg,#000 10%,transparent 95%)}
.lm-score .flagbg.l,.livebar .flagbg.l{left:0;top:0;bottom:0;width:50%;-webkit-mask-image:linear-gradient(90deg,#000 0%,#000 35%,transparent 100%);mask-image:linear-gradient(90deg,#000 0%,#000 35%,transparent 100%)}
.lm-score .flagbg.r,.livebar .flagbg.r{right:0;top:0;bottom:0;width:50%;-webkit-mask-image:linear-gradient(270deg,#000 0%,#000 35%,transparent 100%);mask-image:linear-gradient(270deg,#000 0%,#000 35%,transparent 100%)}
.livebar .flagbg{width:35%!important}
/* ranking list */
.rank-list{display:grid;gap:6px;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.rk{display:grid;grid-template-columns:62px 44px 40px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 18px;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s,box-shadow .18s}
.rk.nolink{cursor:default}
.rk:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 8px 28px rgba(0,0,0,.18)}
.rk .pos{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.rk .chg{font:700 11px var(--f-mono);text-align:center}
.up{color:var(--win)}.down{color:var(--loss)}.flat{color:var(--muted)}
.rk .nm{min-width:0}
.rk .nm b{font-weight:800;font-size:16px;letter-spacing:-.01em}
.rk .nm .pl{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .pts{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--f-mono);padding:4px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
.badge.h{color:var(--hltv);border-color:color-mix(in srgb,var(--hltv) 35%,transparent);background:color-mix(in srgb,var(--hltv) 10%,transparent)}
.badge.v{color:var(--vrs);border-color:color-mix(in srgb,var(--vrs) 35%,transparent);background:color-mix(in srgb,var(--vrs) 10%,transparent)}
.badge.live{color:var(--live);border-color:color-mix(in srgb,var(--live) 45%,transparent);background:color-mix(in srgb,var(--live) 12%,transparent);font-family:var(--f-body);font-weight:800;letter-spacing:.06em}
.badge.mn{color:var(--mn);border-color:color-mix(in srgb,var(--mn) 45%,transparent);background:color-mix(in srgb,var(--mn) 10%,transparent);font-family:var(--f-body)}
.rk.rk-mn{border-color:color-mix(in srgb,var(--mn) 45%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--mn) 25%,transparent),0 0 30px color-mix(in srgb,var(--mn) 15%,transparent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:500}
.legend span{display:inline-flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
/* events */
.mrow.mnm{box-shadow:inset 3px 0 0 var(--mn)}
.mnteams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mnteam{display:flex;align-items:center;gap:12px;padding:14px 16px;transition:transform .18s,border-color .18s}
.mnteam:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--mn) 50%,var(--line))}
.mnteam .flagbg{left:0;top:0;bottom:0;width:60%;-webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent)}
.mnteam .logo{width:34px;height:34px}
.mnteam .sub{margin-left:auto;font-size:12px}
.mnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mnchip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;border:1px solid color-mix(in srgb,var(--mn) 45%,var(--line));background:color-mix(in srgb,var(--mn) 10%,transparent);font-size:13px}
.mnchip:hover{background:color-mix(in srgb,var(--mn) 18%,transparent)}
.ev.mnev{border-color:color-mix(in srgb,var(--mn) 30%,var(--line))}
.brk{padding:16px;overflow-x:auto;font-size:13px}
.brk h2,.brk h3,.brk .headline,.brk .standard-headline{font:600 14px var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 10px;display:block}
.brk h2::before,.brk h2::after{display:none}
.brk img{width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:6px}
.brk table{width:auto;min-width:420px;border-collapse:collapse;margin-bottom:14px}
.brk td,.brk th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.brk a{color:var(--fg)}
.brk a:hover{color:var(--accent)}
.brk [class*="slot"],.brk [class*="match"]{border-radius:8px}
.brk-empty{display:grid;gap:14px;justify-items:center}
.brk-ghost{display:flex;gap:18px;opacity:.5;overflow-x:auto;max-width:100%}
.bcol{display:grid;gap:10px;align-content:center;min-width:140px}
.bcol b{font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.bslot{display:grid;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.bslot span{padding:6px 10px;font-weight:700;color:var(--muted)}
.bslot span+span{border-top:1px solid var(--line)}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.part{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;transition:transform .18s,border-color .18s}
.part:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.part .logo{width:40px;height:40px}
.part .pmeta{min-width:0}
.part .pl{display:flex;flex-wrap:wrap;gap:2px 8px;margin-top:6px;font-size:12px;color:var(--muted)}
.part.mnpart{border-color:color-mix(in srgb,var(--mn) 45%,var(--line))}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:16px;cursor:pointer;align-content:start;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s}
.ev:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ev .logo{width:52px;height:52px}
.ev h3{font-weight:700;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:12px;align-items:center}
.tlogos{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ev .tlogos .logo{width:22px;height:22px}
.ev-list{overflow:hidden}
.ev-list .evr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.ev-list .evr:first-child{border-top:0}
.ev-list .evr:hover{background:var(--panel-2)}
/* team / hero */
.hero{overflow:hidden}
.thead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;padding:28px 26px;align-items:center}
.thead h1{font-size:40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.kpi{background:var(--panel-solid);padding:14px 18px}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.kpi .v{font:700 22px var(--f-display);margin-top:2px}
.kpi .v small{font:600 12px var(--f-body);color:var(--muted);margin-left:6px}
.tabs{display:inline-flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%;justify-self:start}
.tabs button{border:0;background:none;color:var(--muted);font:600 13px var(--f-body);padding:8px 16px;cursor:pointer;border-radius:999px;white-space:nowrap;transition:color .15s,background .15s}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);background:var(--panel-solid);box-shadow:0 1px 3px rgba(0,0,0,.2),0 0 0 1px var(--line)}
.shots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.shot{text-align:center;padding:14px 8px 12px;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s;overflow:hidden}
.shot:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.shot img{width:104px;height:104px;object-fit:cover;object-position:top;border-radius:50%;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--accent) 25%,transparent),var(--panel-2) 70%);display:block;margin:0 auto 8px}
.shot b{display:block;font-weight:800}
.shot .r{font-size:11px;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--panel-2)}
td.r,th.r{text-align:right}
.pcell{display:flex;align-items:center;gap:12px;min-width:170px}
.pcell img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top;background:var(--panel-2)}
.st{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.st.STARTER{color:var(--win);background:color-mix(in srgb,var(--win) 12%,transparent)}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) 70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);transition:background .15s}
.mrow:hover{background:var(--panel-2)}
.mrow .t{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}
.mrow .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .t.r{justify-content:flex-end;text-align:right}
.mrow .sc{text-align:center;font:700 16px var(--f-mono)}
.compact .mrow{grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);padding:10px 14px}
.compact .mrow .dt{grid-column:1/-1;font-size:12px}
.compact .mrow .lk{display:none}
.evhdr{padding:11px 18px;background:var(--panel-2);font-weight:700;font-size:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.evhdr:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.w{color:var(--win)}.l{color:var(--loss)}
.form{display:flex;gap:6px}
.form span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--f-mono);color:#fff}
.form .W{background:var(--win)}.form .L{background:var(--loss)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.two-even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pad{padding:18px}
.stack{display:grid;gap:12px;align-content:start}
.ach{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:11px 18px;border-top:1px solid var(--line);align-items:center;transition:background .15s}
.ach:first-child{border-top:0}
.ach:hover{background:var(--panel-2)}
.place{font:700 12px var(--f-mono)}
.place.gold{color:var(--gold)}.place.silver{color:var(--silver)}.place.bronze{color:var(--bronze)}.place.black{color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid{stroke:var(--line)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.ext{color:var(--accent);font-weight:700}
.ext:hover{text-decoration:underline}
:root{--orn:var(--vrs);--khee:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2020%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22square%22%3E%3Cpath%20d%3D%22M0%201.2H40M0%2018.8H40%22/%3E%3Cpath%20d%3D%22M0%2015.5H6V4.5H34V13.5H14V8H27V11%22/%3E%3Cpath%20d%3D%22M34%2015.5H40%22/%3E%3C/g%3E%3C/svg%3E");--ulzii:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cpath%20d%3D%22M54.67%2022.00L22.00%2054.67M45.33%2022.00L78.00%2054.67M62.45%2029.78L29.78%2062.45M37.55%2029.78L70.22%2062.45M70.22%2037.55L37.55%2070.22M29.78%2037.55L62.45%2070.22M78.00%2045.33L45.33%2078.00M22.00%2045.33L54.67%2078.00M22.00%2054.67A5.50%205.50%200%200%201%2029.78%2062.45M78.00%2054.67A5.50%205.50%200%200%200%2070.22%2062.45M54.67%2022.00A5.50%205.50%200%200%200%2062.45%2029.78M45.33%2022.00A5.50%205.50%200%200%201%2037.55%2029.78M37.55%2070.22A5.50%205.50%200%200%201%2045.33%2078.00M62.45%2070.22A5.50%205.50%200%200%200%2054.67%2078.00M70.22%2037.55A5.50%205.50%200%200%200%2078.00%2045.33M29.78%2037.55A5.50%205.50%200%200%201%2022.00%2045.33%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E");--ever:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%2060%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M60%2052C60%2030%2046%2014%2028%2014%2015%2014%208%2022%208%2031c0%208%206%2013%2013%2013%207%200%2011-5%2011-10%200-5-4-8-8-8%22/%3E%3Cpath%20d%3D%22M60%2052C60%2030%2074%2014%2092%2014c13%200%2020%208%2020%2017%200%208-6%2013-13%2013-7%200-11-5-11-10%200-5%204-8%208-8%22/%3E%3Cpath%20d%3D%22M60%2052c0-8%204-14%2010-17M60%2052c0-8-4-14-10-17%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%228%22%20r%3D%224%22/%3E%3C/g%3E%3C/svg%3E");--ulzii-art:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffe29a%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23e3b04b%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239a6a14%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d%3D%22M54.67%2022.00L22.00%2054.67M45.33%2022.00L78.00%2054.67M62.45%2029.78L29.78%2062.45M37.55%2029.78L70.22%2062.45M70.22%2037.55L37.55%2070.22M29.78%2037.55L62.45%2070.22M78.00%2045.33L45.33%2078.00M22.00%2045.33L54.67%2078.00M22.00%2054.67A5.50%205.50%200%200%201%2029.78%2062.45M78.00%2054.67A5.50%205.50%200%200%200%2070.22%2062.45M54.67%2022.00A5.50%205.50%200%200%200%2062.45%2029.78M45.33%2022.00A5.50%205.50%200%200%201%2037.55%2029.78M37.55%2070.22A5.50%205.50%200%200%201%2045.33%2078.00M62.45%2070.22A5.50%205.50%200%200%200%2054.67%2078.00M70.22%2037.55A5.50%205.50%200%200%200%2078.00%2045.33M29.78%2037.55A5.50%205.50%200%200%201%2022.00%2045.33%22%20fill%3D%22none%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%227.5%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M54.67%2022.00L22.00%2054.67M45.33%2022.00L78.00%2054.67M62.45%2029.78L29.78%2062.45M37.55%2029.78L70.22%2062.45M70.22%2037.55L37.55%2070.22M29.78%2037.55L62.45%2070.22M78.00%2045.33L45.33%2078.00M22.00%2045.33L54.67%2078.00M22.00%2054.67A5.50%205.50%200%200%201%2029.78%2062.45M78.00%2054.67A5.50%205.50%200%200%200%2070.22%2062.45M54.67%2022.00A5.50%205.50%200%200%200%2062.45%2029.78M45.33%2022.00A5.50%205.50%200%200%201%2037.55%2029.78M37.55%2070.22A5.50%205.50%200%200%201%2045.33%2078.00M62.45%2070.22A5.50%205.50%200%200%200%2054.67%2078.00M70.22%2037.55A5.50%205.50%200%200%200%2078.00%2045.33M29.78%2037.55A5.50%205.50%200%200%201%2022.00%2045.33%22%20fill%3D%22none%22%20stroke%3D%22%23060a12%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E")}
/* Mongolian ornament layer: alkhan khee borders, ulzii knots, ever-scroll corners */
.orn-strip{height:12px;background:var(--orn);opacity:.32;-webkit-mask:var(--khee) repeat-x left center/24px 12px;mask:var(--khee) repeat-x left center/24px 12px}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:16px;background:linear-gradient(90deg,transparent 0,#9a6a14 12%,#ffe29a 50%,#9a6a14 88%,transparent 100%);opacity:.55;-webkit-mask:var(--khee) repeat-x center/32px 16px;mask:var(--khee) repeat-x center/32px 16px;pointer-events:none}
h2{display:flex;align-items:center;gap:10px}
h2::before{content:"";flex:none;width:20px;height:20px;background:var(--ulzii-art) center/contain no-repeat}
h2::after{content:"";flex:1;height:12px;min-width:40px;background:linear-gradient(90deg,var(--orn),transparent);opacity:.45;-webkit-mask:var(--khee) repeat-x left center/24px 12px;mask:var(--khee) repeat-x left center/24px 12px}
.hero::after,.article::after{content:"";position:absolute;right:18px;top:16px;width:150px;height:75px;background:linear-gradient(180deg,#ffe29a,#b07a1a);opacity:.28;-webkit-mask:var(--ever) center/contain no-repeat;mask:var(--ever) center/contain no-repeat;pointer-events:none}
.article{position:relative}
.hero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,transparent,var(--orn) 20%,var(--orn) 80%,transparent);opacity:.35;-webkit-mask:var(--khee) repeat-x center/24px 12px;mask:var(--khee) repeat-x center/24px 12px;z-index:1;pointer-events:none}
.ulzii-mark{display:inline-block;width:1em;height:1em;background:currentColor;-webkit-mask:var(--ulzii) center/contain no-repeat;mask:var(--ulzii) center/contain no-repeat;vertical-align:-.12em}
footer{position:relative;padding-top:28px!important}
footer::before{content:"";position:absolute;left:16px;right:16px;top:0;height:16px;background:linear-gradient(90deg,transparent,#9a6a14 12%,#ffe29a 50%,#9a6a14 88%,transparent);opacity:.45;-webkit-mask:var(--khee) repeat-x center/32px 16px;mask:var(--khee) repeat-x center/32px 16px}
body::before{content:"";position:fixed;right:-140px;bottom:-140px;width:460px;height:460px;background:var(--ulzii-art) center/contain no-repeat;opacity:.07;pointer-events:none;z-index:0}
main,footer{position:relative;z-index:1}
/* collapsible lists */
details.mlist>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font:500 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
details.mlist>summary::-webkit-details-marker{display:none}
details.mlist>summary::before{content:"";width:20px;height:20px;background:var(--ulzii-art) center/contain no-repeat}
details.mlist>summary .cnt{font:700 12px var(--f-mono);color:var(--muted);letter-spacing:0}
details.mlist>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
details.mlist[open]>summary::after{transform:rotate(180deg)}
details.mlist[open]>summary{border-bottom:1px solid var(--line)}
details.mlist .mrow:first-child{border-top:0}
footer{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 36px;color:var(--muted);font-size:12px}
.back{color:var(--muted);font-size:13px;font-weight:600;justify-self:start}
.back:hover{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rk:hover,.ev:hover,.shot:hover{transform:none}}
/* live */
.livecount{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--live);color:#fff;font:600 11px var(--f-mono);margin-left:4px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.lm{display:grid;gap:0;overflow:hidden}
.lm-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel-2);font-size:13px}
.lm-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;padding:18px 16px}
.lm-team{display:flex;align-items:center;gap:12px;min-width:0}
.lm-team.r{flex-direction:row-reverse;text-align:right}
.lm-team .logo{width:48px;height:48px}
.lm-team b{font:600 20px var(--f-display);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis}
.lm-team .rk2{font-size:12px;color:var(--muted)}
.lm-mid{text-align:center}
.lm-mid .ser{font:600 34px var(--f-display);letter-spacing:.04em}
.lm-mid .cur{font:500 13px var(--f-mono);color:var(--live)}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.map{background:var(--panel-solid);padding:12px 16px;display:grid;gap:2px;position:relative;isolation:isolate;overflow:hidden;min-height:84px}
.map .mapart{position:absolute;z-index:-1;top:-30%;bottom:-30%;right:-6%;width:62%;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.5;filter:brightness(1.5) saturate(1.2);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%);mask-image:linear-gradient(90deg,transparent 0%,#000 55%);transition:opacity .2s,transform .4s}
.map:hover .mapart{opacity:.75;transform:scale(1.04)}
.map.now .mapart{opacity:.7}
.map .mn{font-weight:600}
.map .ms{font:600 18px var(--f-mono)}
.map.now{background:color-mix(in srgb,var(--live) 8%,var(--panel))}
.lm-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:14px 16px;border-top:1px solid var(--line);font-size:13px}
.lm-foot ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.lineup-row{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.livebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-color:color-mix(in srgb,var(--live) 50%,var(--line))}
.livebar .sc{font:600 18px var(--f-mono)}
.upl .mrow{grid-template-columns:96px minmax(0,1fr) 40px minmax(0,1fr) minmax(0,1.2fr)}
.upl .evn{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.stars{color:var(--vrs);font-size:11px;letter-spacing:1px}
/* player */
.phead{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;padding:20px;align-items:end}
.phead img.body{width:160px;height:160px;object-fit:cover;object-position:top;border-radius:10px;background:var(--panel-2)}
.attrs{display:grid;gap:8px}
.attr{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:13px}
.attr .bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.attr .bar i{display:block;height:100%;background:var(--hltv)}
.trophy-ic{flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.trophy-ic.gold{--t-hi:#ffe08a;--t-lo:#c9971c}.trophy-ic.silver{--t-hi:#eef3f8;--t-lo:#8a97a8}.trophy-ic.bronze{--t-hi:#f3c29a;--t-lo:#9a5a2c}.trophy-ic.black,.trophy-ic.x{--t-hi:#8e9bb0;--t-lo:#4a5566}
.trophy-ph{width:24px}
.ach.ach2{grid-template-columns:28px 92px minmax(0,1fr)}
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding:16px;background:radial-gradient(600px 200px at 50% 0%,rgba(242,193,78,.12),transparent 70%),var(--panel)}
.cab{display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:12px;text-align:center;transition:background .15s,transform .18s}
.cab:hover{background:var(--panel-2);transform:translateY(-2px)}
.cab span{font-size:11px;font-weight:700;line-height:1.25}
.cab em{font-style:normal;font-size:11px;color:var(--muted)}
.trophy{display:flex;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}

.trophy:first-child{border-top:0}
/* match */
/* scorebot: a deliberately dark, broadcast-style component in both themes */
.scorebot{--sb-bg:#151b23;--sb-row:#1c242e;--sb-line:#2a3441;--sb-fg:#e8edf3;--sb-mut:#8796a8;--sb-ct:#3d7fc4;--sb-ct-bg:#2b5c8f;--sb-t:#e0a526;--sb-t-bg:#a37a1b;--sb-hp:#3f9a3a;--sb-red:#c0392b;
  position:relative;background:var(--sb-bg);color:var(--sb-fg);border-radius:10px;overflow:hidden;border:1px solid var(--sb-line);isolation:isolate}
.scorebot::before{content:attr(data-map);position:absolute;right:14px;bottom:-12px;font:700 64px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:rgba(255,255,255,.04);z-index:-1;pointer-events:none;white-space:nowrap}
.hist{display:flex;gap:14px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hhalf{display:grid;gap:3px}
.hnum,.hline{display:flex;gap:3px;align-items:center}
.hnum i{width:18px;text-align:center;font:600 9px var(--f-mono);font-style:normal;color:var(--sb-mut)}
.hnum::before,.hline b{content:"";display:inline-block;width:22px;font:700 9px var(--f-mono)}
.hline.ct b{color:#5aa2e6}.hline.t b{color:#f0b13a}
.hic{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;background:rgba(255,255,255,.04)}
.hic svg{width:12px;height:12px}
.hline.ct .hic:not(.e){background:rgba(90,162,230,.18)}.hline.ct .hic svg{fill:#5aa2e6}
.hline.t .hic:not(.e){background:rgba(240,177,58,.18)}.hline.t .hic svg{fill:#f0b13a}
.hic.e{background:rgba(255,255,255,.03)}
.sb-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;font-size:13px;color:var(--sb-mut)}
.sb-top span:last-child{text-align:right}
.sb-score{font:600 26px var(--f-display);letter-spacing:.04em}
.sb-score .ct{color:var(--sb-ct)}.sb-score .t{color:var(--sb-t)}.sb-score i{font-style:normal;color:var(--sb-mut);margin:0 6px}
.sbwrap{overflow-x:auto;padding:0 10px 8px}
.sb{min-width:640px;width:100%;border-collapse:separate;border-spacing:0 3px}
.sb th{color:#fff;font-size:12px;letter-spacing:0;text-transform:none;padding:7px 10px;border:0;font-weight:600}
.sb.ct thead th{background:var(--sb-ct-bg)}.sb.t thead th{background:var(--sb-t-bg)}
.sb thead th:first-child{border-radius:4px 0 0 4px}.sb thead th:last-child{border-radius:0 4px 4px 0}
.sb th.tn{display:flex;align-items:center;gap:8px;font-size:14px;min-width:150px}
.sb th.tn img{width:22px;height:22px;object-fit:contain}
.sb th.ic,.sb td.ic{text-align:center;width:34px}
.sb td{padding:6px 10px;border:0;background:var(--sb-row);font-size:13px;color:var(--sb-fg)}
.sb.ct td.pn{box-shadow:inset 3px 0 0 var(--sb-ct)}.sb.t td.pn{box-shadow:inset 3px 0 0 var(--sb-t)}
.sb td.pn{font-weight:600;white-space:nowrap}
.sb td.pn a{color:inherit}
.sb td.pn a:hover{text-decoration:underline}
.sb tr.dead td{color:var(--sb-mut);background:rgba(28,36,46,.55)}
.sb tr.dead td.pn{font-weight:400}
.sb .kit{color:var(--sb-ct);vertical-align:-2px}
.hpb{position:relative;display:block;width:64px;height:16px;background:#2b333d;border-radius:2px;overflow:hidden}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--sb-hp)}
.hpb em{position:relative;font:600 11px/16px var(--f-mono);font-style:normal;padding-left:4px;color:#fff}
.dead .hpb i{background:transparent}.dead .hpb em{color:var(--sb-mut)}
.wchip{display:inline-block;font:600 10px/1 var(--f-mono);letter-spacing:.03em;padding:3px 6px;border-radius:3px;background:rgba(255,255,255,.08);color:var(--sb-fg,var(--fg));white-space:nowrap}
.sb-foot{padding:6px 14px 10px;font-size:11px;color:var(--sb-mut);text-align:right}
.glog2{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:12px;max-height:440px;overflow-y:auto;overflow-x:hidden}
.glog2::before{display:none}
.le{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px;padding:3px 9px;border-radius:6px;font-size:13px;font-weight:600;background:rgba(10,14,19,.85);border:2px solid var(--sb-line)}
.le.kill{border-color:var(--sb-red)}
.le.round.t{border-color:var(--sb-t)}.le.round.ct{border-color:var(--sb-ct)}
.le.plant{border-color:var(--sb-t)}.le.defuse{border-color:var(--sb-ct)}
.le.info{border-color:var(--sb-line);color:var(--sb-mut);font-weight:500}
.le .lp.ct{color:#5aa2e6}.le .lp.t{color:#f0b13a}
.le svg{vertical-align:-2px}
.prob{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
.prob .line{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel-2)}
.prob .line i{display:block;height:100%}
.logbox{display:grid}
.lb-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--sb-line);background:linear-gradient(90deg,rgba(255,255,255,.04),transparent)}
.lb-map{font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.lb-head .rleg{margin-left:auto}
.lb-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);height:480px}
.lb-body.noradar{grid-template-columns:minmax(0,1fr)}
.lb-body .glog2{max-height:none;height:100%;border-right:1px solid var(--sb-line);padding:14px 16px 28px;scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(180deg,#000 85%,transparent);mask-image:linear-gradient(180deg,#000 85%,transparent)}
.glog2::-webkit-scrollbar{display:none}
.radar{position:relative;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 50%,rgba(94,162,255,.10),transparent 65%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 32px)}
.rmap{position:relative;width:100%;max-height:100%}
.rmap img{display:block;width:100%;height:100%;object-fit:contain;filter:brightness(1.55) contrast(1.1) drop-shadow(0 0 18px rgba(94,162,255,.25))}
.kx{position:absolute;width:13px;height:13px;transform:translate(-50%,-50%);fill:none;stroke-width:2.6;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(0,0,0,.8))}
.kx.ct{stroke:#5aa2e6}.kx.t{stroke:#f0b13a}
.kx.old{opacity:.35}
@media (prefers-reduced-motion:no-preference){.kx:not(.old){animation:kxpop .5s cubic-bezier(.2,1.4,.4,1)}@keyframes kxpop{from{transform:translate(-50%,-50%) scale(2.2);opacity:0}}}
.rleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--sb-mut)}
.rleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.rleg i.ct{background:#5aa2e6}.rleg i.t{background:#f0b13a}
@media (max-width:860px){.lb-body{grid-template-columns:minmax(0,1fr);height:auto}.lb-body .glog2{max-height:380px;border-right:0;border-bottom:1px solid var(--sb-line)}.lb-head .rleg{margin-left:0}}
.katt{font:600 9px/1 var(--f-mono);padding:2px 4px;border-radius:3px;background:rgba(255,255,255,.12);color:#fff}
.c-CT{color:var(--ct);font-weight:600}.c-T{color:var(--tside);font-weight:600}
.featured{overflow:hidden;display:grid}
.stalebar{flex-basis:100%;padding:10px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--vrs) 45%,var(--line));background:color-mix(in srgb,var(--vrs) 10%,transparent);font-size:13px;font-weight:600}
.feat-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.player{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#000;display:block}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph-player{display:grid;place-items:center;gap:10px;color:#fff;font-weight:700;background:radial-gradient(circle at 50% 45%,rgba(94,162,255,.25),#05070a 70%)}
.ph-player>span:last-child{position:absolute;bottom:18px}
.playbtn{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.6);position:relative}
.playbtn::after{content:"";position:absolute;left:30px;top:22px;border-left:24px solid #fff;border-top:16px solid transparent;border-bottom:16px solid transparent}
.ph-player:hover .playbtn{background:rgba(255,255,255,.22)}
.more{border-top:1px solid var(--line)}
.more summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"▾";color:var(--muted);transition:transform .2s}
.more[open] summary::after{transform:rotate(180deg)}
button.stream{width:100%;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}
button.stream.on{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.streams{display:grid}
.stream{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.stream:first-child{border-top:0}
.stream:hover{background:var(--panel-2)}
.prov{font:600 11px var(--f-mono);padding:2px 7px;border-radius:4px;color:#fff;text-transform:uppercase}
.prov.twitch{background:#7b4fd6}.prov.kick{background:#2f9e3a}.prov.youtube{background:#c4302b}.prov.other{background:var(--muted)}
/* news */
.news{display:grid}
.article{padding:28px 32px;display:grid;gap:14px;max-width:820px}
.article h1{font-size:28px;line-height:1.25}
.article .lede{font-size:17px;font-weight:600;margin:0;max-width:65ch}
.article .keys{margin:0;padding:12px 16px 12px 34px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);display:grid;gap:4px;font-weight:600}
.article .keys li::marker{color:var(--accent)}
.abody p{margin:0 0 12px;font-size:15.5px;line-height:1.75;max-width:68ch}
.asrc{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
a.nitem{transition:background .15s}
a.nitem:hover{background:var(--panel-2)}
a.nitem:hover h3{color:var(--accent)}
.nitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;border-top:1px solid var(--line)}
.nitem:first-child{border-top:0}
.nitem h3{font-family:var(--f-body);font-size:16px;font-weight:600;letter-spacing:0}
.nitem p{margin:0;color:var(--muted);max-width:70ch}
.nitem .when{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
@media (max-width:760px){.phead{grid-template-columns:minmax(0,1fr)}.phead img.body{width:120px;height:120px}.nitem{grid-template-columns:minmax(0,1fr)}.nitem .when{text-align:left}.stream{grid-template-columns:minmax(0,1fr) auto}.stream .vw{display:none}}
@media (max-width:760px){.upl .mrow{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr)}.upl .evn{grid-column:1/-1;text-align:left}.lm-team .logo{width:36px;height:36px}.lm-team b{font-size:16px}.lm-mid .ser{font-size:26px}}
@media (max-width:760px){
  .two{grid-template-columns:minmax(0,1fr)}
  .shots{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rk{grid-template-columns:40px 30px 28px minmax(0,1fr);gap:8px;padding:10px 12px}
  .rk .pts{grid-column:3/-1;justify-content:flex-start}
  .mrow{grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);padding:9px 12px}
  .mrow .dt{grid-column:1/-1;font-size:12px}
  .mrow .lk{display:none}
  .thead{grid-template-columns:minmax(0,1fr)}
  .thead h1{font-size:28px}
  nav.main a{padding:6px 8px}
  .top-in{gap:10px}
}
@media (prefers-reduced-motion:no-preference){.rk,.ev,.evr{transition:background .12s,border-color .12s}}

/* page background: clouds top-left, knot bottom-right */
body::before{content:"";position:fixed;right:-60px;bottom:-40px;width:340px;height:500px;background:var(--gold);opacity:.07;-webkit-mask:var(--o-knot) center/contain no-repeat;mask:var(--o-knot) center/contain no-repeat;pointer-events:none;z-index:0}
body::after{content:"";position:fixed;left:-80px;top:70px;width:520px;height:450px;background:var(--gold);opacity:.05;-webkit-mask:var(--o-clouds) center/contain no-repeat;mask:var(--o-clouds) center/contain no-repeat;pointer-events:none;z-index:0}
/* tsam mask: empty states and the footer seal */
.empty{position:relative}
.empty.tsam{padding-top:150px}
.empty.tsam::before{content:"";position:absolute;left:50%;top:22px;width:96px;height:120px;transform:translateX(-50%);background:var(--gold);opacity:.55;-webkit-mask:var(--o-mask) center/contain no-repeat;mask:var(--o-mask) center/contain no-repeat}
.foot-seal{display:flex;align-items:center;gap:14px}
.foot-seal i{flex:none;width:34px;height:44px;background:var(--gold);opacity:.8;-webkit-mask:var(--o-mask) center/contain no-repeat;mask:var(--o-mask) center/contain no-repeat}
@media (max-width:760px){.hero::after,.article::after{width:90px;right:8px;opacity:.22}.hero .orn-cloud{display:none}body::after{width:300px;height:260px}}

.panel,.rk{background-image:var(--c-tl),var(--c-br);background-repeat:no-repeat;background-size:38px 38px;background-position:left 4px top 4px,right 4px bottom 4px}
.hero,.article{background-image:var(--w-tl),var(--w-tr),var(--w-bl),var(--w-br);background-size:68px 68px;background-position:left 6px top 6px,right 6px top 6px,left 6px bottom 6px,right 6px bottom 6px}
.featured,.brk,.cabinet{background-image:var(--w-tl),var(--w-br);background-size:52px 52px;background-position:left 5px top 5px,right 5px bottom 5px;background-repeat:no-repeat}
.rank-list.panel,.kpis.panel,.empty.panel{background-image:none}
/* header: a double gold rule instead of the meander band */
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,transparent,#b07a1a 12%,#ffe29a 50%,#b07a1a 88%,transparent);opacity:.9;-webkit-mask:linear-gradient(#000 0 0) top/100% 1px no-repeat,linear-gradient(#000 0 0) bottom/100% 1px no-repeat;mask:linear-gradient(#000 0 0) top/100% 1px no-repeat,linear-gradient(#000 0 0) bottom/100% 1px no-repeat}
/* theme switch */
.theme-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.theme-btn:hover{border-color:var(--orn)}
.theme-btn svg{width:18px;height:18px}
.theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:block}
@media (max-width:760px){.theme-btn{order:2;width:34px;height:34px}.hero,.article{background-size:46px 46px}}
/* light theme: many team/event logos are white artwork, so give them a thin dark outline */
:root[data-theme="light"] .logo:not(.ph){filter:drop-shadow(0 0 .6px rgba(8,20,40,.9)) drop-shadow(0 0 1.4px rgba(8,20,40,.45))}
:root[data-theme="light"] .ev .logo:not(.ph),:root[data-theme="light"] .logo.lg:not(.ph){filter:drop-shadow(0 0 1px rgba(8,20,40,.85)) drop-shadow(0 0 2.5px rgba(8,20,40,.35))}
/* ---------- stronger ornaments + flowing alkhan khee under the header ---------- */
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:18px;opacity:1;
  background:linear-gradient(90deg,#8a5d10,#e3b04b 20%,#ffe9b0 50%,#e3b04b 80%,#8a5d10);
  -webkit-mask:var(--khee) repeat-x 0 center/36px 18px;mask:var(--khee) repeat-x 0 center/36px 18px;
  filter:drop-shadow(0 0 4px rgba(227,176,75,.45));animation:khee-flow 2.4s linear infinite;pointer-events:none}
@keyframes khee-flow{to{-webkit-mask-position:36px center;mask-position:36px center}}
@media (prefers-reduced-motion:reduce){header.top::after{animation:none}}
h2::after{opacity:.8;background:linear-gradient(90deg,#c48f2a,rgba(196,143,42,.15))}
.hero::before{opacity:.7}
.hero::after,.article::after{opacity:.55}
.hero .orn-cloud{opacity:.2}
footer::before{opacity:.85}
body::before{opacity:.12}
body::after{opacity:.1}
.empty.tsam::before{opacity:.8}
:root[data-theme="light"] .hero::after,:root[data-theme="light"] .article::after{opacity:.6;background:linear-gradient(180deg,#c48f2a,#7a520c)}
:root[data-theme="light"] body::before,:root[data-theme="light"] body::after{background:linear-gradient(180deg,#c48f2a,#7a520c)}
:root[data-theme="light"]{--gold:linear-gradient(180deg,#c9a66a,#8a6a2e);--orn:#8a6a2e}
:root[data-theme="light"] h2::after{background:linear-gradient(90deg,#9a6a14,rgba(154,106,20,.15))}
:root[data-theme="light"] .hero::before,:root[data-theme="light"] footer::before{background:linear-gradient(90deg,transparent,#9a6a14 15%,#c48f2a 50%,#9a6a14 85%,transparent)}
:root[data-theme="light"] .hero::after,:root[data-theme="light"] .article::after{opacity:.95}
:root[data-theme="light"] .hero::before{opacity:.95}

/* header: the scroll (ever) band from the reference sheet, flowing */
header.top::after{bottom:-12px;height:22px;-webkit-mask:var(--band) repeat-x 0 center/88px 22px;mask:var(--band) repeat-x 0 center/88px 22px;animation:band-flow 6s linear infinite}
@keyframes band-flow{to{-webkit-mask-position:88px center;mask-position:88px center}}
@media (prefers-reduced-motion:reduce){header.top::after{animation:none}}
/* footer: the square meander, horizontal */
footer::before{height:18px;-webkit-mask:var(--hkey) repeat-x left center/38px 18px;mask:var(--hkey) repeat-x left center/38px 18px}
/* page sides on wide screens: the vertical square meander */
.side-key{display:none}
@media (min-width:1260px){
  .side-key{display:block;position:fixed;top:0;bottom:0;width:22px;z-index:5;pointer-events:none;background:linear-gradient(180deg,#9a6a14,#ffe29a 50%,#9a6a14);opacity:.55;-webkit-mask:var(--vkey) repeat-y center 0/22px 46px;mask:var(--vkey) repeat-y center 0/22px 46px}
  .side-key.l{left:10px}.side-key.r{right:10px}
  :root[data-theme="light"] .side-key{background:linear-gradient(180deg,#7a520c,#c48f2a 50%,#7a520c);opacity:.6}
}
.brk2{padding:16px;display:grid;gap:18px;overflow-x:auto}
.bgroup{display:grid;gap:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.bgroup:last-of-type{border-bottom:0}
.bgroup-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bgroup-h b{font:600 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.badv{font-size:12px;font-weight:700;color:var(--win)}
.bout{font-size:12px;font-weight:700;color:var(--loss)}
.blane-t{font:700 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.bcols{display:flex;gap:14px;align-items:center;min-width:max-content}
.bcolumn{display:grid;gap:10px;width:230px;align-content:center;position:relative}
.bcolumn+.bcolumn::before{content:"";position:absolute;left:-14px;top:24px;bottom:0;width:14px;border-top:1px solid var(--line)}
.bcol-t{font:600 11px var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-align:center;color:var(--fg)}
.bm{border:1px solid var(--line);border-radius:10px;background:var(--panel-solid);overflow:hidden;box-shadow:var(--shadow)}
.bm-h{display:flex;justify-content:space-between;padding:5px 10px;font-size:11px;color:var(--muted);background:var(--panel-2)}
.bm-h a{color:var(--accent);font-weight:700}
.bt{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-weight:600;font-size:13px}
.bt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt.win{background:color-mix(in srgb,var(--win) 10%,transparent)}
.bt.win b{color:var(--win)}
.bt.lose{opacity:.55}
.bt:hover{background:var(--panel-2)}
/* ---------- responsive: tablet ---------- */
@media (max-width:1024px){
  .top-in{gap:12px}
  .devby-l{display:none}
  .search input{width:170px}
  .thead h1{font-size:32px}
  .hero::after,.article::after{width:110px;height:55px}
}
/* ---------- responsive: phone ---------- */
@media (max-width:760px){
  header.top::after{bottom:-6px;height:12px;-webkit-mask-size:24px 12px;mask-size:24px 12px}
  .top-in{flex-wrap:wrap;height:auto;padding-block:10px 12px;row-gap:10px}
  .brand{flex:1;min-width:0}
  .devby{order:2;padding:7px 9px}
  .search{order:3;flex:1 1 100%;margin-left:0}
  .search input{width:100%;max-width:none}
  .sres{left:0;right:0;width:auto}
  nav.main{order:4;flex:1 1 100%;overflow-x:auto;scrollbar-width:none}
  nav.main::-webkit-scrollbar{display:none}
  nav.main a{flex:1;justify-content:center;padding:8px 10px;white-space:nowrap}
  main{padding-block:20px 40px;gap:18px}
  h1{font-size:24px}
  h2{font-size:13px}
  .row-head{align-items:stretch}
  .row-head>.seg,.seg{max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap;padding:7px 12px}
  .tabs{justify-self:stretch}
  /* ranking rows */
  .rk{grid-template-columns:44px 26px 30px minmax(0,1fr);gap:8px;padding:10px 12px}
  .rk .pos{font-size:16px}
  .rk .logo{width:26px;height:26px}
  .rk .nm b{font-size:14px}
  .rk .pts{grid-column:3/-1;justify-content:flex-start}
  .rk .flagbg{width:80%}
  /* hero */
  .thead{grid-template-columns:minmax(0,1fr);gap:14px;padding:20px 16px}
  .thead h1{font-size:26px;overflow-wrap:anywhere}
  .logo.lg{width:64px;height:64px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:12px 14px}
  .kpi .v{font-size:18px}
  .hero::after,.article::after{width:84px;height:42px;right:10px;top:10px}
  .phead{grid-template-columns:minmax(0,1fr);padding:18px 16px}
  .phead h1{font-size:30px!important}
  /* cards and lists */
  .ev-grid,.parts,.mnteams{grid-template-columns:minmax(0,1fr)}
  .shots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .shot img{width:84px;height:84px}
  .two,.two-even{grid-template-columns:minmax(0,1fr)}
  .ach.ach2{grid-template-columns:24px 78px minmax(0,1fr)}
  .cabinet{grid-template-columns:repeat(3,minmax(0,1fr))}
  /* live match card */
  .lm-top{font-size:12px;padding:10px 12px}
  .lm-score{gap:8px;padding:14px 12px}
  .lm-team{gap:8px;flex-direction:column;align-items:flex-start}
  .lm-team.r{flex-direction:column;align-items:flex-end}
  .lm-team .logo{width:34px;height:34px}
  .lm-team b{font-size:15px}
  .lm-team .rk2{font-size:10px}
  .lm-mid .ser{font-size:24px}
  .lm-mid .cur{font-size:11px}
  .maps{grid-template-columns:minmax(0,1fr)}
  .map{min-height:64px}
  .lm-foot{grid-template-columns:minmax(0,1fr);padding:12px}
  .livebar{gap:8px;padding:10px 12px;font-size:13px}
  .livebar .sub{flex-basis:100%;order:9}
  /* match page */
  .feat-head{gap:6px;padding:10px 12px}
  .feat-head .ext{margin-left:0!important;flex-basis:100%}
  .sb-top{padding:8px 10px}
  .sb-score{font-size:22px}
  .sbwrap{padding:0 6px 6px}
  .lb-body .glog2{max-height:320px}
  .radar{padding:10px}
  .prob{grid-template-columns:minmax(0,1fr);text-align:center}
  /* upcoming / results rows */
  .mrow,.upl .mrow{grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);padding:10px 12px}
  .mrow .dt,.upl .evn{grid-column:1/-1}
  .mrow .lk{display:none}
  /* news */
  .article{padding:20px 16px}
  .article h1{font-size:22px}
  .nitem{grid-template-columns:minmax(0,1fr)}
  .nitem .when{text-align:left}
  footer{font-size:11px}
  body::before{width:300px;height:300px;right:-110px;bottom:-110px}
}
@media (max-width:380px){
  .brand .wm-main{font-size:26px}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .rk{grid-template-columns:38px 22px 26px minmax(0,1fr)}
}
/* background clouds removed on request */
body::before,body::after,.hero .orn-cloud{display:none!important}
/* header band: solid, even gold across the whole width (no faded ends or pale middle) */
header.top{background:var(--bg)}
header.top::after{opacity:1;background:linear-gradient(180deg,#e0a93a,#b07a1a 55%,#8a5a0a)}
:root[data-theme="light"] header.top::after{background:linear-gradient(180deg,#c48f2a,#9a6a14 55%,#714a08)}
footer::before{opacity:1;background:linear-gradient(180deg,#e0a93a,#b07a1a 55%,#8a5a0a)}
:root[data-theme="light"] footer::before{background:linear-gradient(180deg,#c48f2a,#9a6a14 55%,#714a08)}
/* parchment theme details */
:root[data-theme="light"] nav.main a.on{background:var(--primary);color:#F5EDDA;box-shadow:none}
:root[data-theme="light"] a.btn:hover,:root[data-theme="light"] button.on:hover{background:var(--primary-dk)}
:root[data-theme="light"] .seg button.on,:root[data-theme="light"] .tabs button.on{background:var(--primary);color:#F5EDDA}
:root[data-theme="light"] .rk .pos{color:var(--primary)}
/* header cloud band removed on request */
header.top::after{content:none!important;display:none!important}
/* ornaments pulled inward: side meanders hug the content column; corner knots sit inside the box padding, clear of the text */
@media (min-width:1260px){
  .side-key.l{left:calc(50% - 560px - 34px)}
  .side-key.r{right:calc(50% - 560px - 34px)}
}
.rk{padding-left:44px;padding-right:40px;background-position:left 6px top 6px,right 6px bottom 6px;background-size:30px 30px}
.panel{background-position:left 6px top 6px,right 6px bottom 6px}
@media (max-width:760px){.rk{padding-left:34px;padding-right:30px;background-size:24px 24px}}
/* no corner knots on small cards (participants, events, teams lists) — they crowd the logos */
.parts>*,.ev-grid>*,.mnteams>*,.shots>*,.cabinet>*,.two>.panel .panel{background-image:none!important}
:root[data-theme="light"] .flagbg{filter:saturate(1.35) contrast(1.05)}
/* ornaments tuned to the parchment palette (sand #B8955A, deel red #8E3B2B) */

:root[data-theme="light"] h2::before,:root[data-theme="light"] details.mlist>summary::before{background:var(--primary)}
:root[data-theme="light"] .hero::after,:root[data-theme="light"] .article::after{background:var(--gold);opacity:.45}
:root[data-theme="light"] .hero::before{background:linear-gradient(90deg,transparent,#B8955A 20%,#B8955A 80%,transparent);opacity:.6}
:root[data-theme="light"] footer::before{background:linear-gradient(180deg,#C9A96E,#B8955A 55%,#8E6E3A)}
:root[data-theme="light"] .side-key{background:linear-gradient(180deg,#8E6E3A,#B8955A 50%,#8E6E3A);opacity:.7}
:root[data-theme="light"] .brand .wm-main .tv{background-image:linear-gradient(180deg,#B8955A,#8E3B2B);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .brand .mgl{color:var(--primary);border-left-color:rgba(184,149,90,.6)}
:root[data-theme="light"] .empty.tsam::before,:root[data-theme="light"] .foot-seal i{background:linear-gradient(180deg,#B8955A,#8E3B2B)}
:root[data-theme="light"] .orn-strip{background:#B8955A}
/* big hero ornaments removed everywhere (pendant + woven corners) */
.hero::after,.article::after{display:none!important}
.hero,.article,.featured,.brk,.cabinet{background-image:none!important}
/* ================= parchment, kept plain ================= */
:root[data-theme="light"]{--f-display:"PT Serif",Georgia,serif;--muted:#5a4535;--line:rgba(107,83,64,.28);--panel:#F4EBD6;--panel-solid:#F7F0DF;--panel-2:#E9DCBC;--shadow:none}
:root[data-theme="light"] body{background:var(--bg)}
:root[data-theme="light"] header.top{background:#E9DCBC;border-bottom:1px solid rgba(107,83,64,.35);backdrop-filter:none;-webkit-backdrop-filter:none}
:root[data-theme="light"] h1{font-family:var(--f-display);font-weight:700;letter-spacing:0;color:var(--text)}
:root[data-theme="light"] h2{font-family:var(--f-body);font-weight:800;font-size:13px;letter-spacing:.1em;color:var(--text)}
:root[data-theme="light"] h2::before{display:none}
/* no decoration on rows, cards or page edges */

:root[data-theme="light"] .panel,:root[data-theme="light"] .rk{background-image:none}
/* ranking: a plain list, flag only as a quiet tint behind the logo */
:root[data-theme="light"] .rank-list.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:none;padding:0;gap:0;overflow:hidden}
:root[data-theme="light"] .rk{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:12px 18px}
:root[data-theme="light"] .rk:last-child{border-bottom:0}
:root[data-theme="light"] .rk:hover{transform:none;background:#EFE3C6;box-shadow:none}
:root[data-theme="light"] .rk .flagbg{width:200px;opacity:.38;filter:none;-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent);mask-image:linear-gradient(90deg,#000 40%,transparent)}
:root[data-theme="light"] .rk .pos{font-family:var(--f-display);font-style:normal;font-size:20px;color:var(--text)!important}
:root[data-theme="light"] .rk .nm b{font-family:var(--f-body);font-size:15px;font-weight:800;color:var(--text)}
:root[data-theme="light"] .rk.rk-mn{background:rgba(142,59,43,.06);box-shadow:inset 3px 0 0 var(--primary)}
/* controls */
:root[data-theme="light"] nav.main,:root[data-theme="light"] .seg,:root[data-theme="light"] .tabs{background:#E9DCBC;border:1px solid var(--line);border-radius:8px}
:root[data-theme="light"] nav.main a,:root[data-theme="light"] .seg button,:root[data-theme="light"] .tabs button{border-radius:6px;color:var(--text)}
:root[data-theme="light"] nav.main a.on,:root[data-theme="light"] .seg button.on,:root[data-theme="light"] .tabs button.on{background:var(--primary);color:#F7F0DF;box-shadow:none}
:root[data-theme="light"] .seg button.on .sub,:root[data-theme="light"] .tabs button.on .sub{color:#F7F0DF;opacity:.85}
:root[data-theme="light"] .badge{border-radius:4px;background:transparent}
:root[data-theme="light"] .badge.h{color:var(--primary)}
:root[data-theme="light"] .badge.v{color:#7a5a24}
:root[data-theme="light"] .search input,:root[data-theme="light"] .theme-btn,:root[data-theme="light"] .devby{border-radius:8px;background:#F4EBD6;border-color:var(--line)}
:root[data-theme="light"] .panel{border-radius:8px;box-shadow:none;background-color:var(--panel)}
:root[data-theme="light"] .sub,:root[data-theme="light"] small{color:var(--muted)}
.upfold{padding:0}
.upfold-b{display:grid;gap:10px;padding:0 12px 12px}
.upfold-b>.panel{box-shadow:none}
.logo:is(img){object-fit:contain}
.h2h{padding:16px;display:grid;gap:12px}
.h2h-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.h2h-top a{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800}
.h2h-top a.r{justify-content:flex-end;text-align:right}
.h2h-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h2h-sc{display:grid;grid-template-columns:auto auto auto;align-items:baseline;gap:6px;text-align:center;font-size:30px;font-weight:800}
.h2h-sc small{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--muted)}
.h2h-bar{height:6px;border-radius:3px;background:var(--loss);overflow:hidden}
.h2h-bar i{display:block;height:100%;background:var(--win)}
.h2h-list{display:grid}
.h2h-row{display:grid;grid-template-columns:70px minmax(0,1fr) 60px auto;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-size:13px}
.h2h-row .ev{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h2h-row .sc{font-weight:800;text-align:center}.h2h-row .sc.w{color:var(--win)}.h2h-row .sc.l{color:var(--loss)}
@media (max-width:760px){.h2h-row{grid-template-columns:60px minmax(0,1fr) 50px}.h2h-row>.sub:last-child{display:none}.h2h-sc{font-size:24px}}
.tname{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.nflag{height:.72em;width:auto;aspect-ratio:4/3;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.18);flex:none}
/* ================= old Mongolian book look (light theme) ================= */
:root[data-theme="light"]{--seal:#8E3B2B;--ink:#3A2A1E;--rule:rgba(107,83,64,.55)}
:root[data-theme="light"] header.top{border-top:4px solid var(--seal);border-bottom:3px double var(--rule)}
:root[data-theme="light"] h1{font-family:"PT Serif",Georgia,serif;font-weight:700;color:var(--ink)}
:root[data-theme="light"] h2{font-family:"PT Serif",Georgia,serif;font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--seal);gap:10px}
:root[data-theme="light"] h2::before{display:block;content:"";width:9px;height:9px;background:var(--seal);transform:rotate(45deg);-webkit-mask:none;mask:none;flex:none}
:root[data-theme="light"] h2::after{display:block!important;content:"";flex:1;height:0;border-top:1px solid var(--rule);background:none;-webkit-mask:none;mask:none;opacity:1;min-width:30px}
:root[data-theme="light"] .eyebrow{font-family:"PT Serif",Georgia,serif;color:var(--seal);letter-spacing:.14em}
/* panels as sutra pages: square corners, double ink frame */
:root[data-theme="light"] .panel,:root[data-theme="light"] .rank-list.panel{border-radius:2px;border:1px solid var(--rule);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px rgba(107,83,64,.3)}
:root[data-theme="light"] .rk .pos{font-family:"PT Serif",Georgia,serif;color:var(--seal)!important}
:root[data-theme="light"] .badge{border-radius:2px}
/* controls: square, red seal for the active one */
:root[data-theme="light"] nav.main,:root[data-theme="light"] .seg,:root[data-theme="light"] .tabs,:root[data-theme="light"] .search input,:root[data-theme="light"] .theme-btn,:root[data-theme="light"] .devby{border-radius:2px}
:root[data-theme="light"] nav.main a,:root[data-theme="light"] .seg button,:root[data-theme="light"] .tabs button{border-radius:1px;font-family:"PT Serif",Georgia,serif}
:root[data-theme="light"] nav.main a.on,:root[data-theme="light"] .seg button.on,:root[data-theme="light"] .tabs button.on{background:var(--seal);color:#F7F0DF;box-shadow:inset 0 0 0 2px var(--seal),inset 0 0 0 3px rgba(247,240,223,.5)}
:root[data-theme="light"] footer{border-top:3px double var(--rule);font-family:"PT Serif",Georgia,serif}
.mapstats{padding:16px;display:grid;gap:12px}
.ms-best{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--win) 10%,transparent);border:1px solid color-mix(in srgb,var(--win) 35%,transparent)}
.ms-best b{font-size:20px}
.ms-list{display:grid}
.ms-row{display:grid;grid-template-columns:96px minmax(0,1fr) 48px 64px 60px;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-size:13px}
.ms-row:first-child{border-top:0}
.ms-n{font-weight:800}
.ms-bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--loss) 25%,transparent);overflow:hidden}
.ms-bar i,.mc-bar i{display:block;height:100%;background:var(--win)}
.ms-wr{font-weight:800;text-align:right}
.ms-wl,.ms-p{text-align:right}
.ms-row.best .ms-n{color:var(--win)}
.mapcmp{padding:16px;display:grid;gap:4px}
.mc-head{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:10px;padding-bottom:8px;font-size:14px}
.mc-head .sub{text-align:center}.mc-head .r{text-align:right}
.mc-row{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.mc-n{text-align:center;font-weight:800}
.mc-a,.mc-b{display:flex;align-items:center;gap:8px;min-width:0}
.mc-a{justify-content:flex-end}
.mc-a .num:not(.sub),.mc-b .num:not(.sub){font-weight:800;min-width:38px;text-align:center}
.mc-a.up .num:not(.sub),.mc-b.up .num:not(.sub){color:var(--win)}
.mc-bar{flex:1;max-width:160px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--loss) 22%,transparent);overflow:hidden;display:flex}
.mc-bar.l{justify-content:flex-end}
.mc-foot{display:flex;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
@media (max-width:760px){.ms-row{grid-template-columns:80px minmax(0,1fr) 44px 52px}.ms-p{display:none}.mc-row,.mc-head{grid-template-columns:minmax(0,1fr) 80px minmax(0,1fr)}.mc-bar{display:none}}
/* corner pieces, like brass guards on an old book: they sit on the outer corners of the main frames */
:root[data-theme] .rank-list.panel,:root[data-theme] .hero,:root[data-theme] .article,:root[data-theme] .h2h,:root[data-theme] .brk2{position:relative;overflow:visible}
:root[data-theme] .rank-list.panel::after,:root[data-theme] .hero::after,:root[data-theme] .article::after,:root[data-theme] .h2h::after,:root[data-theme] .brk2::after{
  content:""!important;display:block!important;position:absolute!important;inset:-9px!important;width:auto!important;height:auto!important;z-index:3;pointer-events:none;opacity:1!important;
  -webkit-mask:none!important;mask:none!important;transform:none!important;
  background:var(--w-tl) left top/46px 46px no-repeat,var(--w-tr) right top/46px 46px no-repeat,var(--w-bl) left bottom/46px 46px no-repeat,var(--w-br) right bottom/46px 46px no-repeat!important;
  filter:drop-shadow(0 1px 1px rgba(58,42,30,.25))}
/* clear the guards: a little breathing room inside the list and around the frames */
:root[data-theme] .rank-list.panel{margin-inline:10px;border-radius:2px}
:root[data-theme] .rank-list.panel>.rk:first-child{padding-top:16px}
:root[data-theme] .rank-list.panel>.rk:last-child{padding-bottom:16px}
:root[data-theme] .rank-list.panel>.rk{padding-left:30px}
@media (max-width:760px){:root[data-theme] .rank-list.panel::after,:root[data-theme] .hero::after,:root[data-theme] .article::after,:root[data-theme] .h2h::after,:root[data-theme] .brk2::after{inset:-6px!important;background-size:30px 30px!important}:root[data-theme] .rank-list.panel{margin-inline:6px}:root[data-theme] .rank-list.panel>.rk{padding-left:20px}}

/* corner guards sit above the sticky-header line only on their own frame */
:root[data-theme] .rank-list.panel::after,:root[data-theme] .h2h::after,:root[data-theme] .brk2::after{z-index:2}
/* side meanders back, both themes; on parchment drawn in solid red-brown ink, close to the content column */
@media (min-width:1260px){
  .side-key{display:block}
  .side-key.l{left:calc(50% - 560px - 30px)}
  .side-key.r{right:calc(50% - 560px - 30px)}
  :root[data-theme="light"] .side-key{background:linear-gradient(180deg,#6E2B1F,#8E3B2B 50%,#6E2B1F);opacity:.9}
}

:root[data-theme] .rank-list.panel>.rk{background-image:var(--c-tl),var(--c-br)!important;background-repeat:no-repeat!important;background-size:22px 22px!important;background-position:left 5px top 5px,right 5px bottom 5px!important}
/* side meanders hug the content column, as in the earlier version */
@media (min-width:1260px){.side-key.l{left:calc(50% - 560px - 8px)}.side-key.r{right:calc(50% - 560px - 8px)}}
/* header: a narrow square-meander (алхан хээ) rule along the bottom edge */
:root[data-theme] header.top::after{content:""!important;display:block!important;position:absolute;left:0;right:0;bottom:-15px;height:12px;pointer-events:none;animation:none;opacity:1;
  background:linear-gradient(90deg,#6E2B1F,#8E3B2B 50%,#6E2B1F);-webkit-mask:var(--hkey) repeat-x left center/26px 12px;mask:var(--hkey) repeat-x left center/26px 12px}
:root[data-theme="dark"] header.top::after{background:linear-gradient(90deg,#9a6a14,#e3b04b 50%,#9a6a14)}
@media (max-width:760px){:root[data-theme] header.top::after{height:10px;bottom:-12px;-webkit-mask-size:22px 10px;mask-size:22px 10px}}
/* wide screens: use the width, keep the meanders a clear gutter away from the text */
:root{--wrap:1120px}
@media (min-width:1260px){
  main{padding-inline:36px}
  .side-key.l{left:calc(50% - var(--wrap)/2 - 4px)!important}
  .side-key.r{right:calc(50% - var(--wrap)/2 - 4px)!important}
}
@media (min-width:1480px){
  :root{--wrap:1360px}
  main,.top-in{max-width:var(--wrap)}
}
@media (min-width:1760px){
  :root{--wrap:1560px}
}
/* brackets never widen the page: each lane scrolls sideways inside its own box */
.brk2,.brk{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;max-width:100%}
.brk2>*,.bgroup,.blane{min-width:0}
.blane{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.brk{overflow-x:auto}
@media (max-width:760px){.bcolumn{width:200px}.brk2{padding:12px}}
/* header meander stops at the two side meanders instead of running edge to edge */
@media (min-width:1260px){
  :root[data-theme] header.top::after{left:calc(50% - var(--wrap)/2 + 18px);right:calc(50% - var(--wrap)/2 + 18px)}
}
@media (max-width:1259px){
  :root[data-theme] header.top::after{left:16px;right:16px}
}
/* ---------- side rails ---------- */
.rail{display:none}
@media (min-width:1700px){
  :root{--wrap:1180px}
  main{max-width:var(--wrap)}
  .top-in{max-width:calc(var(--wrap) + 2 * var(--railw) + 120px)}
  :root{--railw:min(300px,calc(50vw - var(--wrap)/2 - 70px))}
  .rail{display:grid;align-content:start;gap:6px;position:fixed;top:104px;bottom:24px;width:var(--railw);overflow:auto;scrollbar-width:thin;z-index:4;padding:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:2px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px rgba(107,83,64,.3)}
  .rl{right:calc(50% + var(--wrap)/2 + 40px)}
  .rr{left:calc(50% + var(--wrap)/2 + 40px)}
}
.rail-h{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font:700 13px "PT Serif",Georgia,serif;letter-spacing:.08em;text-transform:uppercase;color:var(--primary,#8E3B2B)}
.rail-h:first-child{margin-top:0}
.rail-h::before{content:"";width:7px;height:7px;background:currentColor;transform:rotate(45deg);flex:none}
.rail-h::after{content:"";flex:1;border-top:1px solid var(--line)}
.rail-e{font-size:12px;color:var(--muted);padding:4px 2px}
.rm{display:grid;gap:3px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--panel-solid);font-size:13px}
.rm:hover{border-color:var(--accent)}
.rm.mn{box-shadow:inset 3px 0 0 var(--mn)}
.rm-t{display:flex;align-items:center;gap:6px;font:700 11px var(--f-mono);color:var(--muted)}
.rm.on .rm-t{color:var(--live)}
.rm-r{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:7px}
.rm-r b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-r i{font-style:normal;font-weight:800}
.rm .logo.sm,.rt .logo.sm{width:18px;height:18px}
.rt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:13px}
.rt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt span{font-weight:700;color:var(--primary,var(--accent))}
.rt:hover b,.rn:hover{color:var(--accent)}
.rn{display:block;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.35}
.rail-more{margin-top:8px;font-size:12px;font-weight:700;color:var(--accent);text-align:right}
/* footer credit framed by two small knots */
.foot-credit{display:inline-flex;align-items:center;gap:10px}
.foot-credit::before,.foot-credit::after{content:"";width:14px;height:18px;background:var(--gold);-webkit-mask:var(--o-knot) center/contain no-repeat;mask:var(--o-knot) center/contain no-repeat}
:root[data-theme="light"] .foot-credit::before,:root[data-theme="light"] .foot-credit::after{background:#8E3B2B}
.mapbd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.mb-h{font:700 13px "PT Serif",Georgia,serif;letter-spacing:.04em;margin-bottom:12px;color:var(--fg)}
.mb-dist,.mb-hl{padding:16px}
.mb-chart{display:grid;gap:8px}
.mb-row,.mb-axis{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:10px}
.mb-n{text-align:right;font-size:13px;color:var(--muted)}
.mb-track{position:relative;height:22px;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%)}
.mb-track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;min-width:3px}
.mb-track b{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--x,0%) + 6px);font-size:13px}
.mb-ticks{position:relative;height:16px;border-top:1px solid var(--line)}
.mb-ticks i{position:absolute;top:3px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--muted)}
.mb-hl{display:grid;gap:6px;align-content:start}
